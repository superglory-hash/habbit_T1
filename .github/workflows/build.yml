name: Build Habbit APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Android Project (20-Year Heatmap & Backup/Restore)
        run: |
          mkdir -p app/src/main/java/com/example/habbit
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "habbit"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.habbit'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.habbit"
                  minSdk 26
                  targetSdk 34
                  versionCode 7
                  versionName "7.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">habbit</string>
              <string name="accessibility_service_desc">당일 목표를 달성하지 못했을 때 지정된 앱의 실행을 감지하고 차단하기 위해 사용됩니다.</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#00ACC1" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M54,24A30,30 0,1 1,24 54A30,30 0,0 1,54 24M54,32A22,22 0,1 0,76 54A22,22 0,0 0,54 32Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M48,60L38,50L42,46L48,52L66,34L70,38Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/layout/widget_habbit_1x1.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:padding="2dp">
              <ImageView
                  android:id="@+id/widget_canvas"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="fitCenter" />
          </FrameLayout>
          EOF

          cat << 'EOF' > app/src/main/res/xml/habbit_widget_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="50dp"
              android:minHeight="50dp"
              android:targetCellWidth="1"
              android:targetCellHeight="1"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_habbit_1x1"
              android:configure="com.example.habbit.WidgetConfigActivity"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="false"
              android:description="@string/accessibility_service_desc"
              android:notificationTimeout="100" />
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".BlockedAppActivity"
                      android:exported="true"
                      android:launchMode="singleInstance"
                      android:excludeFromRecents="true" />

                  <activity
                      android:name=".WidgetConfigActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_CONFIGURE" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".HabbitBlockerService"
                      android:exported="true"
                      android:label="habbit 미달성 앱 차단 서비스"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <receiver
                      android:name=".HabbitWidgetProvider"
                      android:exported="true"
                      android:label="habbit 1x1 목표 위젯">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="com.example.habbit.ACTION_TOGGLE_HABIT" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/habbit_widget_info" />
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/habbit/HabbitStorage.kt
          package com.example.habbit

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          import java.time.LocalDate
          import kotlin.math.roundToInt

          data class HabitItem(
              val id: String,
              val name: String,
              val color: String,
              val type: String,
              val unit: String,
              val target: Int,
              val blockedPkg: String,
              val blockedAppName: String,
              val days: IntArray,
              val history: JSONObject,
              val rateDay: Int,
              val rateWeek: Int,
              val rateMonth: Int,
              val rateYear: Int,
              val rate60Days: Int
          )

          object HabbitStorage {
              private const val PREF_NAME = "habbit_prefs"
              private const val KEY_HABITS = "habits_json_v6"
              private const val KEY_PERIOD = "selected_period"

              fun dateKeyDaysAgo(daysAgo: Int): String {
                  return LocalDate.now().minusDays(daysAgo.toLong()).toString()
              }

              fun isAchievedOnDay(item: HabitItem, dayIndex: Int = 0): Boolean {
                  if (item.days.isEmpty() || dayIndex !in item.days.indices) return false
                  val v = item.days[dayIndex]
                  return if (item.type == "num") {
                      v >= item.target.coerceAtLeast(1)
                  } else {
                      v > 0
                  }
              }

              private fun computeRate(days: IntArray, type: String, target: Int, windowSize: Int): Int {
                  if (days.isEmpty()) return 0
                  val count = windowSize.coerceAtMost(days.size)
                  var achieved = 0
                  val minTarget = target.coerceAtLeast(1)
                  for (i in 0 until count) {
                      val v = days[i]
                      val ok = if (type == "num") v >= minTarget else v > 0
                      if (ok) achieved++
                  }
                  return ((achieved.toDouble() / count.toDouble()) * 100.0).roundToInt().coerceIn(0, 100)
              }

              fun getRate60Days(item: HabitItem): Int {
                  return computeRate(item.days, item.type, item.target, 60)
              }

              fun getPeriod(context: Context): String {
                  return try {
                      context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                          .getString(KEY_PERIOD, "month") ?: "month"
                  } catch (e: Exception) {
                      "month"
                  }
              }

              fun setPeriod(context: Context, period: String) {
                  try {
                      context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                          .edit().putString(KEY_PERIOD, period).apply()
                      HabbitWidgetProvider.updateAllWidgets(context)
                  } catch (e: Exception) {}
              }

              fun getHabits(context: Context): List<HabitItem> {
                  val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                  var raw = prefs.getString(KEY_HABITS, null)
                  if (raw.isNullOrBlank()) {
                      raw = defaultJson()
                      prefs.edit().putString(KEY_HABITS, raw).apply()
                  }
                  return try {
                      parseHabitList(raw)
                  } catch (e: Exception) {
                      val fallback = defaultJson()
                      prefs.edit().putString(KEY_HABITS, fallback).apply()
                      parseHabitList(fallback)
                  }
              }

              private fun parseHabitList(raw: String): List<HabitItem> {
                  val list = mutableListOf<HabitItem>()
                  val arr = JSONArray(raw)
                  for (i in 0 until arr.length()) {
                      val o = arr.optJSONObject(i) ?: continue
                      val type = o.optString("type", "bool")
                      val target = o.optInt("target", 1).coerceAtLeast(1)
                      val dArr = o.optJSONArray("days") ?: JSONArray()
                      val histObj = o.optJSONObject("history") ?: JSONObject()

                      val days = IntArray(60) { idx ->
                          val dateKey = dateKeyDaysAgo(idx)
                          if (histObj.has(dateKey)) {
                              histObj.optInt(dateKey, 0)
                          } else if (idx < dArr.length()) {
                              val v = dArr.optInt(idx, 0)
                              histObj.put(dateKey, v)
                              v
                          } else {
                              0
                          }
                      }

                      val rateDay = computeRate(days, type, target, 1)
                      val rateWeek = computeRate(days, type, target, 7)
                      val rateMonth = computeRate(days, type, target, 30)
                      val rate60 = computeRate(days, type, target, 60)
                      val rateYear = o.optInt("rateYear", rate60)

                      list.add(
                          HabitItem(
                              id = o.optString("id", "h_$i"),
                              name = o.optString("name", "목표"),
                              color = o.optString("color", "#00acc1"),
                              type = type,
                              unit = o.optString("unit", ""),
                              target = target,
                              blockedPkg = o.optString("blockedPkg", ""),
                              blockedAppName = o.optString("blockedAppName", ""),
                              days = days,
                              history = histObj,
                              rateDay = rateDay,
                              rateWeek = rateWeek,
                              rateMonth = rateMonth,
                              rateYear = rateYear,
                              rate60Days = rate60
                          )
                      )
                  }
                  return list
              }

              fun saveHabitsJson(context: Context, jsonStr: String) {
                  try {
                      context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                          .edit().putString(KEY_HABITS, jsonStr).apply()
                      HabbitWidgetProvider.updateAllWidgets(context)
                  } catch (e: Exception) {}
              }

              fun toggleTodayFromWidget(context: Context, habitId: String) {
                  try {
                      val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                      val raw = prefs.getString(KEY_HABITS, defaultJson()) ?: defaultJson()
                      val arr = JSONArray(raw)
                      val todayKey = dateKeyDaysAgo(0)
                      for (i in 0 until arr.length()) {
                          val o = arr.optJSONObject(i) ?: continue
                          if (o.optString("id") == habitId) {
                              val dArr = o.optJSONArray("days") ?: JSONArray()
                              val histObj = o.optJSONObject("history") ?: JSONObject()
                              val type = o.optString("type", "bool")
                              val target = o.optInt("target", 1).coerceAtLeast(1)
                              val cur = if (histObj.has(todayKey)) histObj.optInt(todayKey, 0) else dArr.optInt(0, 0)
                              val next = if (type == "num") {
                                  if (cur >= target * 2) 0 else cur + 1
                              } else {
                                  if (cur > 0) 0 else 1
                              }
                              dArr.put(0, next)
                              histObj.put(todayKey, next)
                              o.put("history", histObj)

                              val days = IntArray(60) { idx ->
                                  val k = dateKeyDaysAgo(idx)
                                  if (histObj.has(k)) histObj.optInt(k, 0)
                                  else if (idx < dArr.length()) dArr.optInt(idx, 0)
                                  else 0
                              }
                              o.put("rateDay", computeRate(days, type, target, 1))
                              o.put("rateWeek", computeRate(days, type, target, 7))
                              o.put("rateMonth", computeRate(days, type, target, 30))
                              o.put("rate60Days", computeRate(days, type, target, 60))
                          }
                      }
                      prefs.edit().putString(KEY_HABITS, arr.toString()).apply()
                      HabbitWidgetProvider.updateAllWidgets(context)
                  } catch (e: Exception) {}
              }

              fun setWidgetHabitId(context: Context, appWidgetId: Int, habitId: String) {
                  context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                      .edit().putString("widget_$appWidgetId", habitId).apply()
              }

              fun getWidgetHabitId(context: Context, appWidgetId: Int): String {
                  return context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                      .getString("widget_$appWidgetId", "jung") ?: "jung"
              }

              private fun build60Days(first6: IntArray, patternMod: Int, fillVal: Int): JSONArray {
                  val arr = JSONArray()
                  for (i in 0 until 60) {
                      if (i < first6.size) {
                          arr.put(first6[i])
                      } else {
                          arr.put(if (i % patternMod == 0 || i % (patternMod + 1) == 0) fillVal else 0)
                      }
                  }
                  return arr
              }

              fun defaultJson(): String {
                  val arr = JSONArray()

                  fun addDefault(
                      id: String, name: String, color: String, type: String,
                      unit: String, target: Int, blockedPkg: String, blockedAppName: String,
                      first6: IntArray, patternMod: Int, fillVal: Int, rateYear: Int
                  ) {
                      val o = JSONObject()
                      o.put("id", id)
                      o.put("name", name)
                      o.put("color", color)
                      o.put("type", type)
                      o.put("unit", unit)
                      o.put("target", target)
                      o.put("blockedPkg", blockedPkg)
                      o.put("blockedAppName", blockedAppName)
                      val d60 = build60Days(first6, patternMod, fillVal)
                      val hist = JSONObject()
                      for (idx in 0 until d60.length()) {
                          hist.put(dateKeyDaysAgo(idx), d60.optInt(idx, 0))
                      }
                      o.put("days", d60)
                      o.put("history", hist)
                      o.put("rateYear", rateYear)
                      arr.put(o)
                  }

                  addDefault("jung", "중", "#00acc1", "bool", "", 1, "", "", intArrayOf(1,0,1,1,1,0), 2, 1, 58)
                  addDefault("man", "만", "#fb8c00", "bool", "", 1, "com.google.android.youtube,com.instagram.android", "YouTube,Instagram", intArrayOf(0,0,0,1,1,0), 4, 1, 48)
                  addDefault("un", "운", "#7cb342", "bool", "", 1, "", "", intArrayOf(1,0,0,1,0,0), 3, 1, 41)
                  addDefault("gyung", "경", "#d81b60", "num", "장", 5, "", "", intArrayOf(5,0,0,3,0,0), 3, 5, 44)
                  addDefault("mul", "물", "#8e24aa", "bool", "", 1, "", "", intArrayOf(0,0,0,0,0,0), 5, 1, 25)
                  addDefault("jung2", "중2", "#1e88e5", "bool", "", 1, "", "", intArrayOf(0,0,0,0,0,0), 4, 1, 38)

                  return arr.toString()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/habbit/HabbitBlockerService.kt
          package com.example.habbit

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.view.accessibility.AccessibilityEvent

          class HabbitBlockerService : AccessibilityService() {

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null || event.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  val pkg = event.packageName?.toString() ?: return

                  if (pkg == packageName ||
                      pkg.contains("systemui") ||
                      pkg.contains("launcher") ||
                      pkg.contains("settings") ||
                      pkg.contains("inputmethod") ||
                      pkg.contains("honeyboard") ||
                      pkg.contains("documentsui")) {
                      return
                  }

                  val habits = HabbitStorage.getHabits(this)
                  val unachievedBlockingHabits = habits.filter { habit ->
                      if (habit.blockedPkg.isBlank() || HabbitStorage.isAchievedOnDay(habit, 0)) {
                          false
                      } else {
                          val pkgs = habit.blockedPkg.split(",").map { it.trim() }.filter { it.isNotEmpty() }
                          pkgs.contains(pkg)
                      }
                  }

                  if (unachievedBlockingHabits.isNotEmpty()) {
                      val firstHabit = unachievedBlockingHabits.first()
                      val requirementDesc = unachievedBlockingHabits.joinToString("\n") { h ->
                          if (h.type == "num") {
                              val cur = if (h.days.isNotEmpty()) h.days[0] else 0
                              "• [${h.name}] 기준 ${h.target}${h.unit} 이상 필요 (현재 ${cur}${h.unit})"
                          } else {
                              "• [${h.name}] 당일 목표 On(✓) 체크 필요"
                          }
                      }

                      val pkgList = firstHabit.blockedPkg.split(",").map { it.trim() }
                      val nameList = firstHabit.blockedAppName.split(",").map { it.trim() }
                      val idx = pkgList.indexOf(pkg)
                      var matchedAppName = if (idx >= 0 && idx < nameList.size && nameList[idx].isNotBlank()) {
                          nameList[idx]
                      } else {
                          ""
                      }
                      if (matchedAppName.isBlank()) {
                          matchedAppName = try {
                              val ai = packageManager.getApplicationInfo(pkg, 0)
                              packageManager.getApplicationLabel(ai).toString()
                          } catch (e: Exception) {
                              pkg
                          }
                      }

                      val lockIntent = Intent(this, BlockedAppActivity::class.java).apply {
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                          putExtra("habit_name", firstHabit.name)
                          putExtra("habit_color", firstHabit.color)
                          putExtra("req_desc", requirementDesc)
                          putExtra("blocked_app_name", matchedAppName)
                      }
                      startActivity(lockIntent)
                  }
              }

              override fun onInterrupt() {}
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/habbit/BlockedAppActivity.kt
          package com.example.habbit

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class BlockedAppActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  renderLockView(intent)
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  if (intent != null) renderLockView(intent)
              }

              private fun renderLockView(intent: Intent) {
                  val habitName = intent.getStringExtra("habit_name") ?: "목표"
                  val habitColor = intent.getStringExtra("habit_color") ?: "#d81b60"
                  val reqDesc = intent.getStringExtra("req_desc") ?: "당일 목표를 먼저 달성해주세요."
                  val appName = intent.getStringExtra("blocked_app_name") ?: "선택된 앱"

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(64, 64, 64, 64)
                      setBackgroundColor(Color.parseColor("#1E1E1E"))
                  }

                  val iconView = TextView(this).apply {
                      text = "🔒"
                      textSize = 54f
                      gravity = Gravity.CENTER
                  }
                  root.addView(iconView)

                  val titleView = TextView(this).apply {
                      text = "[${appName}] 실행이 제한되었습니다"
                      textSize = 21f
                      setTextColor(Color.WHITE)
                      typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
                      gravity = Gravity.CENTER
                      setPadding(0, 32, 0, 16)
                  }
                  root.addView(titleView)

                  val descView = TextView(this).apply {
                      text = "당일 목표 미달성으로 인해 앱이 잠겨 있습니다.\n아래 목표를 달성하면 즉시 잠금이 해제됩니다."
                      textSize = 14f
                      setTextColor(Color.parseColor("#BBBBBB"))
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 40)
                  }
                  root.addView(descView)

                  val badgeView = TextView(this).apply {
                      text = reqDesc
                      textSize = 15f
                      setTextColor(Color.WHITE)
                      typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
                      gravity = Gravity.CENTER
                      setPadding(36, 36, 36, 36)
                      try {
                          setBackgroundColor(Color.parseColor(habitColor))
                      } catch (e: Exception) {
                          setBackgroundColor(Color.parseColor("#00ACC1"))
                      }
                  }
                  root.addView(badgeView)

                  val openHabbitBtn = Button(this).apply {
                      text = "habbit 열어서 [${habitName}] 기록하기"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#00ACC1"))
                      val lp = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                      lp.setMargins(0, 64, 0, 24)
                      layoutParams = lp
                      setOnClickListener {
                          startActivity(Intent(this@BlockedAppActivity, MainActivity::class.java).apply {
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                          })
                          finish()
                      }
                  }
                  root.addView(openHabbitBtn)

                  val homeBtn = Button(this).apply {
                      text = "홈 화면으로 돌아가기"
                      textSize = 15f
                      setTextColor(Color.parseColor("#CCCCCC"))
                      setBackgroundColor(Color.parseColor("#333333"))
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                      setOnClickListener {
                          val home = Intent(Intent.ACTION_MAIN).apply {
                              addCategory(Intent.CATEGORY_HOME)
                              flags = Intent.FLAG_ACTIVITY_NEW_TASK
                          }
                          startActivity(home)
                          finish()
                      }
                  }
                  root.addView(homeBtn)

                  setContentView(root)
              }

              override fun onBackPressed() {
                  val home = Intent(Intent.ACTION_MAIN).apply {
