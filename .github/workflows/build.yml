          package com.example.habbit

          import android.annotation.SuppressLint
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.text.TextUtils
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity
          import org.json.JSONArray
          import org.json.JSONObject

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  webView = WebView(this)
                  webView.settings.javaScriptEnabled = true
                  webView.settings.domStorageEnabled = true
                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = WebChromeClient()
                  webView.addJavascriptInterface(AndroidBridge(), "AndroidBridge")
                  setContentView(webView)
                  webView.loadUrl("file:///android_asset/index.html")
              }

              override fun onResume() {
                  super.onResume()
                  webView.evaluateJavascript("window.refreshFromAndroid && window.refreshFromAndroid();", null)
              }

              private fun isAccessibilityServiceEnabled(): Boolean {
                  val expectedComponentName = "$packageName/${HabbitBlockerService::class.java.canonicalName}"
                  val enabledServices = Settings.Secure.getString(
                      contentResolver,
                      Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  val splitter = TextUtils.SimpleStringSplitter(':')
                  splitter.setString(enabledServices)
                  while (splitter.hasNext()) {
                      val component = splitter.next()
                      if (component.equals(expectedComponentName, ignoreCase = true)) {
                          return true
                      }
                  }
                  return false
              }

              inner class AndroidBridge {
                  @JavascriptInterface
                  fun getHabitsJson(): String {
                      val list = HabbitStorage.getHabits(this@MainActivity)
                      val arr = JSONArray()
                      for (h in list) {
                          val o = JSONObject()
                          o.put("id", h.id)
                          o.put("name", h.name)
                          o.put("color", h.color)
                          o.put("type", h.type)
                          o.put("unit", h.unit)
                          o.put("target", h.target)
                          o.put("blockedPkg", h.blockedPkg)
                          o.put("blockedAppName", h.blockedAppName)
                          val d = JSONArray()
                          h.days.forEach { d.put(it) }
                          o.put("days", d)
                          o.put("rateDay", h.rateDay)
                          o.put("rateWeek", h.rateWeek)
                          o.put("rateMonth", h.rateMonth)
                          o.put("rateYear", h.rateYear)
                          o.put("rate60Days", h.rate60Days)
                          arr.put(o)
                      }
                      return arr.toString()
                  }

                  @JavascriptInterface
                  fun saveHabits(jsonStr: String) {
                      HabbitStorage.saveHabitsJson(this@MainActivity, jsonStr)
                  }

                  @JavascriptInterface
                  fun getPeriod(): String = HabbitStorage.getPeriod(this@MainActivity)

                  @JavascriptInterface
                  fun setPeriod(p: String) {
                      HabbitStorage.setPeriod(this@MainActivity, p)
                  }

                  @JavascriptInterface
                  fun isBlockerServiceEnabled(): Boolean {
                      return isAccessibilityServiceEnabled()
                  }

                  @JavascriptInterface
                  fun openAccessibilitySettings() {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }

                  @JavascriptInterface
                  fun getInstalledAppsJson(): String {
                      val pm = packageManager
                      val mainIntent = Intent(Intent.ACTION_MAIN, null).apply {
                          addCategory(Intent.CATEGORY_LAUNCHER)
                      }
                      val resolveInfos = pm.queryIntentActivities(mainIntent, 0)
                      val arr = JSONArray()
                      val seen = mutableSetOf<String>()
                      for (ri in resolveInfos) {
                          val pkg = ri.activityInfo.packageName
                          if (pkg != packageName && seen.add(pkg)) {
                              val label = ri.loadLabel(pm).toString()
                              val o = JSONObject()
                              o.put("pkg", pkg)
                              o.put("name", label)
                              arr.put(o)
                          }
                      }
                      return arr.toString()
                  }
              }
          }
