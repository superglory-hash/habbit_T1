name: Build Habbit APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Android Project & 1x1 Widget Code
        run: |
          mkdir -p app/src/main/java/com/example/habbit
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "habbit"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.habbit'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.habbit"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#00ACC1" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M54,24A30,30 0,1 1,24 54A30,30 0,0 1,54 24M54,32A22,22 0,1 0,76 54A22,22 0,0 0,54 32Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M48,60L38,50L42,46L48,52L66,34L70,38Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/layout/widget_habbit_1x1.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:padding="2dp">
              <ImageView
                  android:id="@+id/widget_canvas"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="fitCenter" />
          </FrameLayout>
          EOF

          cat << 'EOF' > app/src/main/res/xml/habbit_widget_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="50dp"
              android:minHeight="50dp"
              android:targetCellWidth="1"
              android:targetCellHeight="1"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_habbit_1x1"
              android:configure="com.example.habbit.WidgetConfigActivity"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="habbit"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".WidgetConfigActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_CONFIGURE" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".HabbitWidgetProvider"
                      android:exported="true"
                      android:label="habbit 1x1 목표 위젯">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="com.example.habbit.ACTION_TOGGLE_HABIT" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/habbit_widget_info" />
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/habbit/HabbitStorage.kt
          package com.example.habbit

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          data class HabitItem(
              val id: String,
              val name: String,
              val color: String,
              val type: String, // "bool" or "num"
              val unit: String,
              val target: Int,
              val days: IntArray, // last 6 days (index 0 = today)
              val rateDay: Int,
              val rateWeek: Int,
              val rateMonth: Int,
              val rateYear: Int
          )

          object HabbitStorage {
              private const val PREF_NAME = "habbit_prefs"
              private const val KEY_HABITS = "habits_json"
              private const val KEY_PERIOD = "selected_period" // day, week, month, year

              fun getPeriod(context: Context): String {
                  return context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                      .getString(KEY_PERIOD, "month") ?: "month"
              }

              fun setPeriod(context: Context, period: String) {
                  context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                      .edit().putString(KEY_PERIOD, period).apply()
                  HabbitWidgetProvider.updateAllWidgets(context)
              }

              fun getHabits(context: Context): List<HabitItem> {
                  val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                  var raw = prefs.getString(KEY_HABITS, null)
                  if (raw == null) {
                      raw = defaultJson()
                      prefs.edit().putString(KEY_HABITS, raw).apply()
                  }
                  val list = mutableListOf<HabitItem>()
                  val arr = JSONArray(raw)
                  for (i in 0 until arr.length()) {
                      val o = arr.getJSONObject(i)
                      val dArr = o.getJSONArray("days")
                      val days = IntArray(dArr.length()) { idx -> dArr.getInt(idx) }
                      list.add(
                          HabitItem(
                              id = o.getString("id"),
                              name = o.getString("name"),
                              color = o.getString("color"),
                              type = o.optString("type", "bool"),
                              unit = o.optString("unit", ""),
                              target = o.optInt("target", 1),
                              days = days,
                              rateDay = o.optInt("rateDay", 50),
                              rateWeek = o.optInt("rateWeek", 50),
                              rateMonth = o.optInt("rateMonth", 50),
                              rateYear = o.optInt("rateYear", 50)
                          )
                      )
                  }
                  return list
              }

              fun saveHabitsJson(context: Context, jsonStr: String) {
                  context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                      .edit().putString(KEY_HABITS, jsonStr).apply()
                  HabbitWidgetProvider.updateAllWidgets(context)
              }

              fun toggleToday(context: Context, habitId: String) {
                  val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                  val raw = prefs.getString(KEY_HABITS, defaultJson()) ?: defaultJson()
                  val arr = JSONArray(raw)
                  for (i in 0 until arr.length()) {
                      val o = arr.getJSONObject(i)
                      if (o.getString("id") == habitId) {
                          val dArr = o.getJSONArray("days")
                          val type = o.optString("type", "bool")
                          val cur = dArr.getInt(0)
                          val next = if (type == "num") {
                              if (cur >= 10) 0 else cur + 1
                          } else {
                              if (cur > 0) 0 else 1
                          }
                          dArr.put(0, next)
                          val doneCount = (0 until dArr.length()).count { dArr.getInt(it) > 0 }
                          val weekPct = ((doneCount.toFloat() / dArr.length()) * 100).toInt()
                          o.put("rateDay", if (next > 0) 100 else 0)
                          o.put("rateWeek", weekPct)
                      }
                  }
                  prefs.edit().putString(KEY_HABITS, arr.toString()).apply()
                  HabbitWidgetProvider.updateAllWidgets(context)
              }

              fun setWidgetHabitId(context: Context, appWidgetId: Int, habitId: String) {
                  context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                      .edit().putString("widget_$appWidgetId", habitId).apply()
              }

              fun getWidgetHabitId(context: Context, appWidgetId: Int): String {
                  return context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                      .getString("widget_$appWidgetId", "jung") ?: "jung"
              }

              fun rateForPeriod(item: HabitItem, period: String): Int {
                  return when (period) {
                      "day" -> if (item.days.isNotEmpty() && item.days[0] > 0) 100 else 0
                      "week" -> item.rateWeek
                      "year" -> item.rateYear
                      else -> item.rateMonth
                  }
              }

              private fun defaultJson(): String {
                  return """
                  [
                    {"id":"jung","name":"중","color":"#00acc1","type":"bool","unit":"","target":1,"days":[1,0,1,1,1,0],"rateDay":100,"rateWeek":67,"rateMonth":62,"rateYear":58},
                    {"id":"man","name":"만","color":"#fb8c00","type":"bool","unit":"","target":1,"days":[0,0,0,1,1,0],"rateDay":0,"rateWeek":33,"rateMonth":35,"rateYear":48},
                    {"id":"un","name":"운","color":"#7cb342","type":"bool","unit":"","target":1,"days":[1,0,0,1,0,0],"rateDay":100,"rateWeek":33,"rateMonth":45,"rateYear":41},
                    {"id":"gyung","name":"경","color":"#d81b60","type":"num","unit":"장","target":5,"days":[5,0,0,3,0,0],"rateDay":100,"rateWeek":48,"rateMonth":52,"rateYear":44},
                    {"id":"mul","name":"물","color":"#8e24aa","type":"bool","unit":"","target":1,"days":[0,0,0,0,0,0],"rateDay":0,"rateWeek":14,"rateMonth":20,"rateYear":25},
                    {"id":"jung2","name":"중2","color":"#1e88e5","type":"bool","unit":"","target":1,"days":[0,0,0,0,0,0],"rateDay":0,"rateWeek":29,"rateMonth":42,"rateYear":38}
                  ]
                  """.trimIndent()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/habbit/HabbitWidgetProvider.kt
          package com.example.habbit

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.graphics.*
          import android.widget.RemoteViews

          class HabbitWidgetProvider : AppWidgetProvider() {

              override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
                  for (appWidgetId in appWidgetIds) {
                      updateSingleWidget(context, appWidgetManager, appWidgetId)
                  }
              }

              override fun onReceive(context: Context, intent: Intent) {
                  super.onReceive(context, intent)
                  if (intent.action == ACTION_TOGGLE) {
                      val widgetId = intent.getIntExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, -1)
                      if (widgetId != -1) {
                          val habitId = HabbitStorage.getWidgetHabitId(context, widgetId)
                          HabbitStorage.toggleToday(context, habitId)
                      }
                  }
              }

              companion object {
                  const val ACTION_TOGGLE = "com.example.habbit.ACTION_TOGGLE_HABIT"

                  fun updateAllWidgets(context: Context) {
                      val manager = AppWidgetManager.getInstance(context)
                      val ids = manager.getAppWidgetIds(ComponentName(context, HabbitWidgetProvider::class.java))
                      for (id in ids) {
                          updateSingleWidget(context, manager, id)
                      }
                  }

                  fun updateSingleWidget(context: Context, manager: AppWidgetManager, appWidgetId: Int) {
                      val habitId = HabbitStorage.getWidgetHabitId(context, appWidgetId)
                      val habits = HabbitStorage.getHabits(context)
                      val habit = habits.find { it.id == habitId } ?: habits.first()
                      val period = HabbitStorage.getPeriod(context)
                      val pct = HabbitStorage.rateForPeriod(habit, period)

                      val bmp = renderOneByOneWidget(habit, pct)
                      val views = RemoteViews(context.packageName, R.layout.widget_habbit_1x1)
                      views.setImageViewBitmap(R.id.widget_canvas, bmp)

                      val intent = Intent(context, HabbitWidgetProvider::class.java).apply {
                          action = ACTION_TOGGLE
                          putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, appWidgetId)
                      }
                      val pending = PendingIntent.getBroadcast(
                          context,
                          appWidgetId,
                          intent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                      views.setOnClickPendingIntent(R.id.widget_root, pending)
                      manager.updateAppWidget(appWidgetId, views)
                  }

                  private fun renderOneByOneWidget(habit: HabitItem, pct: Int): Bitmap {
                      val size = 256
                      val bmp = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888)
                      val canvas = Canvas(bmp)
                      val todayVal = if (habit.days.isNotEmpty()) habit.days[0] else 0
                      val isDone = todayVal > 0

                      val bgPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          color = if (isDone) Color.parseColor(habit.color) else Color.parseColor("#3F3F3F")
                          style = Paint.Style.FILL
                      }
                      val cardRect = RectF(8f, 8f, size - 8f, size - 8f)
                      canvas.drawRoundRect(cardRect, 58f, 58f, bgPaint)

                      val cx = size / 2f
                      val cy = 108f
                      val radius = 58f

                      val trackPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          color = Color.argb(65, 255, 255, 255)
                          style = Paint.Style.STROKE
                          strokeWidth = 10f
                      }
                      canvas.drawCircle(cx, cy, radius, trackPaint)

                      val progPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          color = Color.WHITE
                          style = Paint.Style.STROKE
                          strokeWidth = 10f
                          strokeCap = Paint.Cap.ROUND
                      }
                      val arcRect = RectF(cx - radius, cy - radius, cx + radius, cy + radius)
                      val sweep = (pct.coerceIn(0, 100) / 100f) * 360f
                      canvas.drawArc(arcRect, -90f, sweep, false, progPaint)

                      val centerTextPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          color = Color.WHITE
                          textAlign = Paint.Align.CENTER
                          typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
                          textSize = 36f
                      }
                      val centerLabel = when {
                          habit.type == "num" && isDone -> todayVal.toString()
                          isDone -> "✓"
                          else -> "✕"
                      }
                      val textOffset = (centerTextPaint.descent() + centerTextPaint.ascent()) / 2
                      canvas.drawText(centerLabel, cx, cy - textOffset, centerTextPaint)

                      val titlePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          color = Color.WHITE
                          textAlign = Paint.Align.CENTER
                          typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
                          textSize = 32f
                      }
                      canvas.drawText(habit.name, cx, 218f, titlePaint)

                      return bmp
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/habbit/WidgetConfigActivity.kt
          package com.example.habbit

          import android.app.Activity
          import android.appwidget.AppWidgetManager
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class WidgetConfigActivity : Activity() {
              private var appWidgetId = AppWidgetManager.INVALID_APPWIDGET_ID

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setResult(RESULT_CANCELED)

                  appWidgetId = intent?.extras?.getInt(
                      AppWidgetManager.EXTRA_APPWIDGET_ID,
                      AppWidgetManager.INVALID_APPWIDGET_ID
                  ) ?: AppWidgetManager.INVALID_APPWIDGET_ID

                  if (appWidgetId == AppWidgetManager.INVALID_APPWIDGET_ID) {
                      finish()
                      return
                  }

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 64, 48, 64)
                      setBackgroundColor(Color.parseColor("#F5F5F5"))
                  }

                  val title = TextView(this).apply {
                      text = "1x1 위젯에 표시할 목표 선택"
                      textSize = 20f
                      setTextColor(Color.parseColor("#212121"))
                      setPadding(0, 0, 0, 32)
                  }
                  root.addView(title)

                  val habits = HabbitStorage.getHabits(this)
                  for (h in habits) {
                      val btn = Button(this).apply {
                          text = "${h.name} (월 달성율 ${h.rateMonth}%)"
                          textSize = 16f
                          setTextColor(Color.WHITE)
                          setBackgroundColor(Color.parseColor(h.color))
                          val lp = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          )
                          lp.setMargins(0, 0, 0, 24)
                          layoutParams = lp
                          setOnClickListener {
                              HabbitStorage.setWidgetHabitId(this@WidgetConfigActivity, appWidgetId, h.id)
                              val mgr = AppWidgetManager.getInstance(this@WidgetConfigActivity)
                              HabbitWidgetProvider.updateSingleWidget(this@WidgetConfigActivity, mgr, appWidgetId)
                              val resultValue = Intent().putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, appWidgetId)
                              setResult(RESULT_OK, resultValue)
                              finish()
                          }
                      }
                      root.addView(btn)
                  }

                  val scroll = ScrollView(this).apply { addView(root) }
                  setContentView(scroll)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/habbit/MainActivity.kt
          package com.example.habbit

          import android.annotation.SuppressLint
          import android.os.Bundle
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity
          import org.json.JSONArray

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  webView = WebView(this)
                  webView.settings.javaScriptEnabled = true
                  webView.settings.domStorageEnabled = true
                  webView.webViewClient = WebViewClient()
                  webView.addJavascriptInterface(AndroidBridge(), "AndroidBridge")
                  setContentView(webView)
                  loadTrackerHtml()
              }

              override fun onResume() {
                  super.onResume()
                  webView.evaluateJavascript("window.refreshFromAndroid && window.refreshFromAndroid();", null)
              }

              inner class AndroidBridge {
                  @JavascriptInterface
                  fun getHabitsJson(): String {
                      val list = HabbitStorage.getHabits(this@MainActivity)
                      val arr = JSONArray()
                      for (h in list) {
                          val o = org.json.JSONObject()
                          o.put("id", h.id)
                          o.put("name", h.name)
                          o.put("color", h.color)
                          o.put("type", h.type)
                          o.put("unit", h.unit)
                          o.put("target", h.target)
                          val d = JSONArray()
                          h.days.forEach { d.put(it) }
                          o.put("days", d)
                          o.put("rateDay", h.rateDay)
                          o.put("rateWeek", h.rateWeek)
                          o.put("rateMonth", h.rateMonth)
                          o.put("rateYear", h.rateYear)
                          arr.put(o)
                      }
                      return arr.toString()
                  }

                  @JavascriptInterface
                  fun saveHabits(jsonStr: String) {
                      HabbitStorage.saveHabitsJson(this@MainActivity, jsonStr)
                  }

                  @JavascriptInterface
                  fun getPeriod(): String = HabbitStorage.getPeriod(this@MainActivity)

                  @JavascriptInterface
                  fun setPeriod(p: String) {
                      HabbitStorage.setPeriod(this@MainActivity, p)
                  }
              }

              private fun loadTrackerHtml() {
                  val html = """
                  <!DOCTYPE html>
                  <html lang="ko">
                  <head>
                  <meta charset="UTF-8" />
                  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
                  <style>
                    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
                    body { background: #f3f4f6; color: #222; }
                    .topbar { background: #303030; color: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
                    .topbar h1 { font-size: 20px; font-weight: 700; }
                    .period-tabs { display: flex; background: #222; padding: 6px 12px; gap: 6px; }
                    .period-btn { flex: 1; text-align: center; padding: 7px 0; font-size: 12px; color: #aaa; border-radius: 6px; border: 1px solid #444; background: transparent; font-weight: 600; }
                    .period-btn.active { background: #00acc1; color: #fff; border-color: #00acc1; }
                    .header-row { display: flex; align-items: center; background: #eee; padding: 8px 12px; border-bottom: 1px solid #ddd; font-size: 11px; color: #777; font-weight: 700; }
                    .habit-col { width: 34%; }
                    .day-col { width: 11%; text-align: center; }
                    .habit-card { display: flex; align-items: center; background: #fff; padding: 14px 12px; margin-bottom: 4px; border-bottom: 1px solid #e5e7eb; }
                    .habit-info { width: 34%; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
                    .cell-btn { width: 11%; text-align: center; font-size: 16px; font-weight: 700; padding: 6px 0; border: none; background: transparent; }
                    .detail-header { color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 14px; }
                    .card { background: #fff; margin-bottom: 8px; padding: 14px 16px; border-bottom: 1px solid #e5e7eb; }
                    .card-title { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
                    .overview-row { display: flex; justify-content: space-between; align-items: center; text-align: center; }
                    .bar-wrap { display: flex; align-items: flex-end; height: 120px; gap: 6px; padding-top: 16px; border-bottom: 1px solid #eee; }
                    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
                    .bar-fill { width: 12px; border-radius: 2px 2px 0 0; }
                    .bar-lbl { font-size: 9px; color: #888; margin-top: 4px; }
                    .fab { position: fixed; right: 18px; bottom: 18px; width: 52px; height: 52px; border-radius: 26px; background: #00acc1; color: #fff; font-size: 28px; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.25); }
                  </style>
                  </head>
                  <body>
                  <div id="app"></div>
                  <script>
                    let habits = [];
                    let period = 'month';
                    let selectedHabitId = null;
                    const dayLabels = [['일',8],['토',7],['금',6],['목',5],['수',4],['화',3]];

                    function loadData() {
                      if (window.AndroidBridge) {
                        habits = JSON.parse(window.AndroidBridge.getHabitsJson());
                        period = window.AndroidBridge.getPeriod();
                      }
                      render();
                    }
                    window.refreshFromAndroid = loadData;

                    function getRate(h) {
                      if (period === 'day') return h.days[0] > 0 ? 100 : 0;
                      if (period === 'week') return h.rateWeek;
                      if (period === 'year') return h.rateYear;
                      return h.rateMonth;
                    }

                    function setPeriodMode(p) {
                      period = p;
                      if (window.AndroidBridge) window.AndroidBridge.setPeriod(p);
                      render();
                    }

                    function toggleCell(hIdx, dIdx) {
                      const h = habits[hIdx];
                      if (h.type === 'num') {
                        h.days[dIdx] = h.days[dIdx] >= 5 ? 0 : h.days[dIdx] + 1;
                      } else {
                        h.days[dIdx] = h.days[dIdx] > 0 ? 0 : 1;
                      }
                      const done = h.days.filter(v => v > 0).length;
                      h.rateDay = h.days[0] > 0 ? 100 : 0;
                      h.rateWeek = Math.round((done / h.days.length) * 100);
                      if (window.AndroidBridge) window.AndroidBridge.saveHabits(JSON.stringify(habits));
                      render();
                    }

                    function addNewHabit() {
                      const name = prompt('새 목표 이름을 입력하세요 (예: 독서)');
                      if (!name) return;
                      const colors = ['#00acc1','#fb8c00','#7cb342','#d81b60','#8e24aa','#1e88e5'];
                      habits.push({
                        id: 'h_' + Date.now(),
                        name: name.trim(),
                        color: colors[habits.length % colors.length],
                        type: 'bool',
                        unit: '',
                        target: 1,
                        days: [0,0,0,0,0,0],
                        rateDay: 0, rateWeek: 0, rateMonth: 50, rateYear: 50
                      });
                      if (window.AndroidBridge) window.AndroidBridge.saveHabits(JSON.stringify(habits));
                      render();
                    }

                    function ringSvg(pct, color, size) {
                      const r = (size - 6) / 2;
                      const c = 2 * Math.PI * r;
                      const offset = c - (pct / 100) * c;
                      return '<svg width="'+size+'" height="'+size+'" style="transform:rotate(-90deg)">' +
                        '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="#e0e0e0" stroke-width="3.5"/>' +
                        '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="3.5" stroke-dasharray="'+c+'" stroke-dashoffset="'+offset+'" stroke-linecap="round"/>' +
                        '</svg>';
                    }

                    function render() {
                      const root = document.getElementById('app');
                      if (selectedHabitId) {
                        const h = habits.find(x => x.id === selectedHabitId) || habits[0];
                        const pct = getRate(h);
                        const bars = [14,22,25,18,12,21,24,26,19,22,15,pct];
                        root.innerHTML =
                          '<div class="detail-header" style="background:'+h.color+'">' +
                            '<span onclick="selectedHabitId=null;render()" style="font-size:22px;cursor:pointer">←</span>' +
                            '<h2 style="font-size:19px">'+h.name+' 상세 달성율</h2>' +
                          '</div>' +
                          '<div class="period-tabs">' +
                            ['day','week','month','year'].map(p =>
                              '<button class="period-btn '+(period===p?'active':'')+'" onclick="setPeriodMode(\''+p+'\')">'+
                              (p==='day'?'일별':p==='week'?'주별':p==='month'?'월별':'연별')+'</button>'
                            ).join('') +
                          '</div>' +
                          '<div class="card">' +
                            '<div class="card-title" style="color:'+h.color+'">한눈에 보기</div>' +
                            '<div class="overview-row">' +
                              '<div>'+ringSvg(pct, h.color, 34)+'</div>' +
                              '<div><div style="color:'+h.color+';font-weight:700">'+pct+'%</div><div style="font-size:11px;color:#777">현재 달성율</div></div>' +
                              '<div><div style="font-weight:700">'+h.rateWeek+'%</div><div style="font-size:11px;color:#777">주간</div></div>' +
                              '<div><div style="font-weight:700">'+h.rateMonth+'%</div><div style="font-size:11px;color:#777">월간</div></div>' +
                              '<div><div style="font-weight:700">'+h.rateYear+'%</div><div style="font-size:11px;color:#777">연간</div></div>' +
                            '</div>' +
                          '</div>' +
                          '<div class="card">' +
                            '<div class="card-title" style="color:'+h.color+'">기간별 달성 이력 ('+(period==='day'?'일별':period==='week'?'주별':period==='month'?'월별':'연별')+')</div>' +
                            '<div class="bar-wrap">' +
                              bars.map((v,i) =>
                                '<div class="bar-col">' +
                                  '<div style="font-size:9px;color:#777;margin-bottom:2px">'+v+'</div>' +
                                  '<div class="bar-fill" style="height:'+Math.max(8, v)+ 'px;background:'+h.color+'"></div>' +
                                  '<div class="bar-lbl">'+(i+1)+'</div>' +
                                '</div>'
                              ).join('') +
                            '</div>' +
                          '</div>';
                        return;
                      }

                      root.innerHTML =
                        '<div class="topbar"><h1>습관</h1><span style="font-size:12px;color:#bbb">목표 터치 시 상세 통계</span></div>' +
                        '<div class="period-tabs">' +
                          ['day','week','month','year'].map(p =>
                            '<button class="period-btn '+(period===p?'active':'')+'" onclick="setPeriodMode(\''+p+'\')">'+
                            (p==='day'?'일별 달성율':p==='week'?'주별 달성율':p==='month'?'월별 달성율':'연별 달성율')+'</button>'
                          ).join('') +
                        '</div>' +
                        '<div class="header-row">' +
                          '<div class="habit-col">목표 (달성율 링)</div>' +
                          dayLabels.map(d => '<div class="day-col">'+d[0]+'<br>'+d[1]+'</div>').join('') +
                        '</div>' +
                        habits.map((h, hIdx) =>
                          '<div class="habit-card">' +
                            '<div class="habit-info" onclick="selectedHabitId=\''+h.id+'\';render()" style="color:'+h.color+'">' +
                              ringSvg(getRate(h), h.color, 24) +
                              '<span>'+h.name+'</span>' +
                            '</div>' +
                            h.days.map((v, dIdx) =>
                              '<button class="cell-btn" style="color:'+(v>0?h.color:'#ccc')+'" onclick="toggleCell('+hIdx+','+dIdx+')">' +
                                (h.type==='num' ? (v + '<div style="font-size:9px">'+h.unit+'</div>') : (v>0?'✓':'✕')) +
                              '</button>'
                            ).join('') +
                          '</div>'
                        ).join('') +
                        '<button class="fab" onclick="addNewHabit()">+</button>';
                    }

                    loadData();
                  </script>
                  </body>
                  </html>
                  """.trimIndent()
                  webView.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null)
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload habbit APK
        uses: actions/upload-artifact@v4
        with:
          name: habbit-apk
          path: app/build/outputs/apk/debug/app-debug.apk
