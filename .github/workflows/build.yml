          <body>
          <div id="app"></div>
          <div id="modal-root"></div>

          <script>
            let habits = [];
            let period = 'month';
            let selectedHabitId = null;
            let blockerEnabled = false;
            let installedApps = [];
            let appSearchQuery = '';
            const palette = ['#00acc1','#fb8c00','#7cb342','#d81b60','#8e24aa','#1e88e5','#e53935','#3949ab'];
            const presetApps = [
              { name: 'YouTube', pkg: 'com.google.android.youtube' },
              { name: 'Instagram', pkg: 'com.instagram.android' },
              { name: '카카오톡', pkg: 'com.kakao.talk' },
              { name: 'TikTok', pkg: 'com.zhiliaoapp.musically' },
              { name: 'Chrome', pkg: 'com.android.chrome' },
              { name: 'Netflix', pkg: 'com.netflix.mediaclient' },
              { name: '네이버 웹툰', pkg: 'com.nhn.android.webtoon' },
              { name: 'X(트위터)', pkg: 'com.twitter.android' }
            ];

            function getDateInfo(daysAgo) {
              const d = new Date();
              d.setDate(d.getDate() - daysAgo);
              const m = d.getMonth() + 1;
              const date = d.getDate();
              const korDays = ['일','월','화','수','목','금','토'];
              const dow = korDays[d.getDay()];
              return {
                year: d.getFullYear(),
                month: m,
                d: date,
                dow: dow,
                shortLabel: m + '/' + date + '(' + dow + ')',
                fullLabel: m + '월 ' + date + '일(' + dow + '요일)'
              };
            }

            function getRecent6DayLabels() {
              const arr = [];
              for (let i = 0; i < 6; i++) {
                const info = getDateInfo(i);
                arr.push([info.dow, info.month + '/' + info.d]);
              }
              return arr;
            }

            function ensure60Days(h) {
              if (!Array.isArray(h.days)) h.days = [];
              while (h.days.length < 60) h.days.push(0);
              if (h.days.length > 60) h.days = h.days.slice(0, 60);
            }

            function isAchieved(h, dayIdx) {
              const val = (h.days && h.days[dayIdx]) || 0;
              if (h.type === 'num') {
                return val >= (h.target || 1);
              }
              return val > 0;
            }

            function calcWindowRate(h, winSize) {
              ensure60Days(h);
              const n = Math.min(winSize, h.days.length);
              let ok = 0;
              for (let i = 0; i < n; i++) {
                if (isAchieved(h, i)) ok++;
              }
              return Math.round((ok / n) * 100);
            }

            // 특정 구간(예: 특정 월, 특정 주)의 달성율 계산 함수
            function calcCustomRangeRate(h, startIndex, length) {
              ensure60Days(h);
              let achieved = 0;
              let counted = 0;
              const minTarget = h.target || 1;
              for (let i = startIndex; i < startIndex + length && i < h.days.length; i++) {
                const v = h.days[i];
                const ok = (h.type === 'num') ? (v >= minTarget) : (v > 0);
                if (ok) achieved++;
                counted++;
              }
              if (counted === 0) return 0;
              return Math.round((achieved / counted) * 100);
            }

            // 1. 일별 시간별 진도 데이터 (최근 10일)
            function getDailyProgressData(h) {
              ensure60Days(h);
              const result = [];
              for (let i = 9; i >= 0; i--) {
                const info = getDateInfo(i);
                const ok = isAchieved(h, i);
                const val = h.days[i] || 0;
                result.push({
                  label: info.month + '/' + info.d + '(' + info.dow + ')',
                  rate: ok ? 100 : 0,
                  valText: h.type === 'num' ? (val + h.unit) : (ok ? '달성' : '미달')
                });
              }
              return result;
            }

            // 2. 주별 시간별 진도 데이터 (최근 6주)
            function getWeeklyProgressData(h) {
              ensure60Days(h);
              const result = [];
              for (let w = 5; w >= 0; w--) {
                const start = w * 7;
                const rate = calcCustomRangeRate(h, start, 7);
                result.push({
                  label: (w === 0 ? '이번 주' : (w + '주 전')),
                  rate: rate,
                  valText: rate + '%'
                });
              }
              return result;
            }

            // 3. 월별 시간별 진도 데이터 (최근 4개월: 예 8월, 9월, 10월, 11월)
            function getMonthlyProgressData(h) {
              ensure60Days(h);
              const result = [];
              // 약 30일씩 끊어서 최근 4개월(현재 기준 역순) 분할
              const monthNames = [];
              for (let m = 3; m >= 0; m--) {
                const d = new Date();
                d.setMonth(d.getMonth() - m);
                monthNames.push((d.getMonth() + 1) + '월');
              }
              for (let mIdx = 3; mIdx >= 0; mIdx--) {
                const start = mIdx * 15; // 15일 단위 구간 분석
                const rate = calcCustomRangeRate(h, start, 15);
                const targetMonthName = monthNames[3 - mIdx] || (mIdx + '달전');
                result.push({
                  label: targetMonthName,
                  rate: rate,
                  valText: rate + '%'
                });
              }
              return result;
            }

            // 4. 연별 시간별 진도 데이터 (최근 연도별)
            function getYearlyProgressData(h) {
              ensure60Days(h);
              const currentYear = new Date().getFullYear();
              const result = [];
              for (let y = 2; y >= 0; y--) {
                const targetYear = currentYear - y;
                const rate = (y === 0) ? calcWindowRate(h, 60) : (h.rateYear || 45);
                result.push({
                  label: targetYear + '년',
                  rate: rate,
                  valText: rate + '%'
                });
              }
              return result;
            }

            function getProgressDataForCurrentPeriod(h) {
              if (period === 'day') return getDailyProgressData(h);
              if (period === 'week') return getWeeklyProgressData(h);
              if (period === 'year') return getYearlyProgressData(h);
              return getMonthlyProgressData(h); // default month
            }

            function recalcRates(h) {
              ensure60Days(h);
              h.rateDay = calcWindowRate(h, 1);
              h.rateWeek = calcWindowRate(h, 7);
              h.rateMonth = calcWindowRate(h, 30);
              h.rate60Days = calcWindowRate(h, 60);
              h.rateYear = calcWindowRate(h, 365);
            }

            function parseBlockedApps(h) {
              const pkgs = (h.blockedPkg || '').split(',').map(s => s.trim()).filter(Boolean);
              const names = (h.blockedAppName || '').split(',').map(s => s.trim());
              return pkgs.map((pkg, idx) => ({
                pkg: pkg,
                name: names[idx] || pkg
              }));
            }

            function loadData() {
              if (window.AndroidBridge) {
                habits = JSON.parse(window.AndroidBridge.getHabitsJson());
                habits.forEach(h => { ensure60Days(h); recalcRates(h); });
                period = window.AndroidBridge.getPeriod();
                blockerEnabled = window.AndroidBridge.isBlockerServiceEnabled();
                try {
                  installedApps = JSON.parse(window.AndroidBridge.getInstalledAppsJson());
                } catch (e) { installedApps = []; }
              }
              render();
            }
            window.refreshFromAndroid = loadData;

            function saveAll() {
              habits.forEach(h => recalcRates(h));
              if (window.AndroidBridge) {
                window.AndroidBridge.saveHabits(JSON.stringify(habits));
              }
              render();
            }

            function getAppViewRate(h) {
              if (period === 'day') return h.rateDay;
              if (period === 'week') return h.rateWeek;
              if (period === 'year') return h.rateYear;
              return h.rateMonth;
            }

            function setPeriodMode(p) {
              period = p;
              if (window.AndroidBridge) window.AndroidBridge.setPeriod(p);
              render();
            }

            function handleCellClick(hIdx, dIdx) {
              const h = habits[hIdx];
              ensure60Days(h);
              if (h.type === 'num') {
                openNumberInputModal(hIdx, dIdx);
              } else {
                h.days[dIdx] = h.days[dIdx] > 0 ? 0 : 1;
                saveAll();
              }
            }

            function openNumberInputModal(hIdx, dIdx) {
              const h = habits[hIdx];
              const curVal = h.days[dIdx] || 0;
              const dayTitle = getDateInfo(dIdx).fullLabel;
              const modalRoot = document.getElementById('modal-root');
              modalRoot.innerHTML =
                '<div class="modal-backdrop" onclick="closeModal()">' +
                  '<div class="modal-box" onclick="event.stopPropagation()">' +
                    '<div class="modal-title">[' + h.name + '] ' + dayTitle + ' 수치 기록</div>' +
                    '<div style="font-size:12px;color:#555;margin-bottom:12px;">' +
                      '달성 기준: <b style="color:' + h.color + '">' + h.target + (h.unit || '') + ' 이상</b> 기록 시 달성(PASS)' +
                    '</div>' +
                    '<div class="form-group">' +
                      '<label class="form-label">기록할 수치 (' + (h.unit || '단위 없음') + ')</label>' +
                      '<input id="num-val-input" type="number" class="form-input" value="' + curVal + '" min="0" />' +
                    '</div>' +
                    '<div class="preset-chips">' +
                      [0, 1, 3, h.target, h.target + 2, h.target * 2].map(v =>
                        '<button type="button" class="chip" onclick="document.getElementById(\'num-val-input\').value=' + v + '">' + v + (h.unit || '') + '</button>'
                      ).join('') +
                    '</div>' +
                    '<div class="btn-row">' +
                      '<button class="btn btn-secondary" onclick="closeModal()">취소</button>' +
                      '<button class="btn btn-primary" onclick="saveNumberInput(' + hIdx + ',' + dIdx + ')">저장</button>' +
                    '</div>' +
                  '</div>' +
                '</div>';
            }

            function saveNumberInput(hIdx, dIdx) {
              const val = parseInt(document.getElementById('num-val-input').value, 10);
              const h = habits[hIdx];
              h.days[dIdx] = isNaN(val) || val < 0 ? 0 : val;
              closeModal();
              saveAll();
            }

            let draftHabit = null;
            let draftBlockedList = [];
            let editingIndex = -1;

            function openHabitEditor(hIdx) {
              editingIndex = hIdx;
              appSearchQuery = '';
              if (hIdx >= 0) {
                draftHabit = JSON.parse(JSON.stringify(habits[hIdx]));
                ensure60Days(draftHabit);
                draftBlockedList = parseBlockedApps(draftHabit);
              } else {
                draftHabit = {
                  id: 'h_' + Date.now(),
                  name: '',
                  color: palette[habits.length % palette.length],
                  type: 'bool',
                  unit: '장',
                  target: 5,
                  blockedPkg: '',
                  blockedAppName: '',
                  days: new Array(60).fill(0),
                  rateDay: 0, rateWeek: 0, rateMonth: 0, rateYear: 50, rate60Days: 0
                };
                draftBlockedList = [];
              }
              renderEditorModal();
            }

            function syncDraftFields() {
              const nameEl = document.getElementById('ed-name');
              if (nameEl) draftHabit.name = nameEl.value;
              const targetEl = document.getElementById('ed-target');
              if (targetEl) draftHabit.target = Math.max(1, parseInt(targetEl.value, 10) || 1);
              const unitEl = document.getElementById('ed-unit');
              if (unitEl) draftHabit.unit = unitEl.value;
              const searchEl = document.getElementById('ed-app-search');
              if (searchEl) appSearchQuery = searchEl.value;
            }

            function isPkgSelected(pkg) {
              return draftBlockedList.some(item => item.pkg === pkg);
            }

            function toggleBlockedApp(pkg, name) {
              syncDraftFields();
              if (!pkg) return;
              const idx = draftBlockedList.findIndex(item => item.pkg === pkg);
              if (idx >= 0) {
                draftBlockedList.splice(idx, 1);
              } else {
                draftBlockedList.push({ pkg: pkg, name: name || pkg });
              }
              renderEditorModal();
            }

            function clearAllBlockedApps() {
              syncDraftFields();
              draftBlockedList = [];
              renderEditorModal();
            }

            function addCustomBlockedApp() {
              syncDraftFields();
              const customName = (document.getElementById('ed-custom-name').value || '').trim();
              const customPkg = (document.getElementById('ed-custom-pkg').value || '').trim();
              if (!customPkg) {
                alert('추가할 앱의 패키지명을 입력해주세요.');
                return;
              }
              if (!isPkgSelected(customPkg)) {
                draftBlockedList.push({ pkg: customPkg, name: customName || customPkg });
              }
              renderEditorModal();
            }

            function selectDraftType(t) {
              syncDraftFields();
              draftHabit.type = t;
              renderEditorModal();
            }

            function selectDraftColor(c) {
              syncDraftFields();
              draftHabit.color = c;
              renderEditorModal();
            }

            function onAppSearchInput(el) {
              appSearchQuery = el.value;
              renderInstalledAppsListOnly();
            }

            function renderInstalledAppsListOnly() {
              const container = document.getElementById('installed-apps-container');
              if (!container) return;
              const q = (appSearchQuery || '').toLowerCase();
              const filtered = installedApps.filter(a =>
                a.name.toLowerCase().includes(q) || a.pkg.toLowerCase().includes(q)
              );
              if (filtered.length === 0) {
                container.innerHTML = '<div style="font-size:11px;color:#888;padding:6px">검색된 앱이 없습니다.</div>';
                return;
              }
              container.innerHTML = filtered.map(a => {
                const checked = isPkgSelected(a.pkg);
                const safeName = a.name.replace(/'/g, "\\'");
                return '<label class="app-check-item">' +
                  '<input type="checkbox" ' + (checked ? 'checked' : '') + ' onchange="toggleBlockedApp(\'' + a.pkg + '\',\'' + safeName + '\')" />' +
                  '<span style="font-weight:600;color:#222">' + a.name + '</span>' +
                  '<span style="font-size:10px;color:#888;margin-left:auto">' + a.pkg + '</span>' +
                '</label>';
              }).join('');
            }

            function renderEditorModal() {
              const modalRoot = document.getElementById('modal-root');
              const isEdit = editingIndex >= 0;
              modalRoot.innerHTML =
                '<div class="modal-backdrop" onclick="closeModal()">' +
                  '<div class="modal-box" onclick="event.stopPropagation()">' +
                    '<div class="modal-title">' + (isEdit ? '항목 이름·속성 수정 및 삭제' : '새 목표 항목 추가') + '</div>' +
                    '<div class="form-group">' +
                      '<label class="form-label">1. 항목 이름</label>' +
                      '<input id="ed-name" class="form-input" placeholder="예: 독서, 운동, 물 마시기" value="' + (draftHabit.name || '') + '" />' +
                    '</div>' +
                    '<div class="form-group">' +
                      '<label class="form-label">2. 항목 달성 속성 (On/Off vs 기준 수치 체크)</label>' +
                      '<div class="type-selector">' +
                        '<div class="type-opt ' + (draftHabit.type === 'bool' ? 'selected' : '') + '" onclick="selectDraftType(\'bool\')">' +
                          '✓ On/Off 달성형<br><span style="font-size:10px;font-weight:400">달성 여부만 체크</span>' +
                        '</div>' +
                        '<div class="type-opt ' + (draftHabit.type === 'num' ? 'selected' : '') + '" onclick="selectDraftType(\'num\')">' +
                          '123 수치 기준 체크형<br><span style="font-size:10px;font-weight:400">기준 수치 이상 달성 체크</span>' +
                        '</div>' +
                      '</div>' +
                    '</div>' +
                    (draftHabit.type === 'num' ? (
                      '<div class="form-group" style="background:#f0fdf4;padding:10px;border-radius:8px;border:1px solid #bbf7d0">' +
                        '<label class="form-label" style="color:#166534">기준 수치 설정 (이 수치를 넘어야 당일 달성 인정)</label>' +
                        '<div style="display:flex;gap:8px">' +
                          '<div style="flex:1">' +
                            '<span style="font-size:11px;color:#555">목표 기준 수치</span>' +
                            '<input id="ed-target" type="number" min="1" class="form-input" value="' + draftHabit.target + '" />' +
                          '</div>' +
                          '<div style="flex:1">' +
                            '<span style="font-size:11px;color:#555">단위 (예: 장, 분, 잔)</span>' +
                            '<input id="ed-unit" class="form-input" value="' + (draftHabit.unit || '') + '" placeholder="장" />' +
                          '</div>' +
                        '</div>' +
                      '</div>'
                    ) : '') +
                    '<div class="form-group">' +
                      '<label class="form-label">3. 테마 색상</label>' +
                      '<div class="color-row">' +
                        palette.map(c =>
                          '<div class="color-dot ' + (draftHabit.color === c ? 'selected' : '') + '" style="background:' + c + '" onclick="selectDraftColor(\'' + c + '\')"></div>'
                        ).join('') +
                      '</div>' +
                    '</div>' +
                    '<div class="form-group" style="background:#fff1f2;padding:10px;border-radius:8px;border:1px solid #fecdd3">' +
                      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">' +
                        '<label class="form-label" style="color:#be123c;margin:0">4. 당일 미달성 시 차단할 앱 (복수 선택 가능: ' + draftBlockedList.length + '개)</label>' +
                        (draftBlockedList.length > 0 ? '<button type="button" style="font-size:11px;color:#be123c;background:none;border:none;font-weight:700" onclick="clearAllBlockedApps()">전체 해제</button>' : '') +
                      '</div>' +
                      '<div class="selected-app-tags">' +
                        (draftBlockedList.length === 0
                          ? '<span style="font-size:11px;color:#888">선택된 차단 앱이 없습니다. 아래에서 여러 개를 터치해 추가하세요.</span>'
                          : draftBlockedList.map(item =>
                              '<span class="app-tag" onclick="toggleBlockedApp(\'' + item.pkg + '\',\'' + item.name.replace(/'/g, "\\'") + '\')">🔒 ' + item.name + ' ✕</span>'
                            ).join('')
                        ) +
                      '</div>' +
                      '<div style="font-size:11px;color:#555;margin-bottom:4px;font-weight:600">자주 쓰는 앱 빠른 다중 선택:</div>' +
                      '<div class="preset-chips">' +
                        presetApps.map(p =>
                          '<button type="button" class="chip ' + (isPkgSelected(p.pkg) ? 'active' : '') + '" onclick="toggleBlockedApp(\'' + p.pkg + '\',\'' + p.name + '\')">' +
                            (isPkgSelected(p.pkg) ? '✓ ' : '+ ') + p.name +
                          '</button>'
                        ).join('') +
                      '</div>' +
                      (installedApps.length > 0 ? (
                        '<div style="margin-top:8px">' +
                          '<div style="font-size:11px;color:#555;margin-bottom:4px;font-weight:600">내 휴대폰에 설치된 앱에서 여러 개 체크:</div>' +
                          '<input id="ed-app-search" class="form-input" style="padding:6px 8px;font-size:12px" placeholder="앱 이름 검색..." value="' + appSearchQuery + '" oninput="onAppSearchInput(this)" />' +
                          '<div id="installed-apps-container" class="app-check-list"></div>' +
                        '</div>' +
                      ) : '') +
                      '<div style="margin-top:8px;display:flex;gap:4px">' +
                        '<input id="ed-custom-name" class="form-input" style="flex:1;padding:6px;font-size:11px" placeholder="앱 이름" />' +
                        '<input id="ed-custom-pkg" class="form-input" style="flex:1.5;padding:6px;font-size:11px" placeholder="패키지명 직접 입력" />' +
                        '<button type="button" class="chip active" style="flex-shrink:0" onclick="addCustomBlockedApp()">+추가</button>' +
                      '</div>' +
                    '</div>' +
                    '<div class="btn-row">' +
                      (isEdit ? '<button class="btn btn-danger" onclick="deleteHabit(' + editingIndex + ')">삭제</button>' : '') +
                      '<button class="btn btn-secondary" onclick="closeModal()">취소</button>' +
                      '<button class="btn btn-primary" onclick="saveHabitEditor()">저장</button>' +
                    '</div>' +
                  '</div>' +
                '</div>';

              renderInstalledAppsListOnly();
            }

            function saveHabitEditor() {
              syncDraftFields();
              if (!draftHabit.name || !draftHabit.name.trim()) {
                alert('항목 이름을 입력해주세요.');
                return;
              }
              draftHabit.name = draftHabit.name.trim();
              draftHabit.blockedPkg = draftBlockedList.map(x => x.pkg).join(',');
              draftHabit.blockedAppName = draftBlockedList.map(x => x.name).join(',');
              recalcRates(draftHabit);
              if (editingIndex >= 0) {
                habits[editingIndex] = draftHabit;
              } else {
                habits.push(draftHabit);
              }
              closeModal();
              saveAll();
            }

            function deleteHabit(idx) {
              const target = habits[idx];
              if (!confirm('[' + target.name + '] 항목을 삭제하시겠습니까?')) return;
              habits.splice(idx, 1);
              if (selectedHabitId === target.id) selectedHabitId = null;
              closeModal();
              saveAll();
            }

            function closeModal() {
              document.getElementById('modal-root').innerHTML = '';
            }

            function openAccessibility() {
              if (window.AndroidBridge) {
                window.AndroidBridge.openAccessibilitySettings();
              }
            }

            function ringSvg(pct, color, size) {
              const r = (size - 6) / 2;
              const c = 2 * Math.PI * r;
              const offset = c - (pct / 100) * c;
              return '<svg width="' + size + '" height="' + size + '" style="transform:rotate(-90deg);flex-shrink:0">' +
                '<circle cx="' + (size/2) + '" cy="' + (size/2) + '" r="' + r + '" fill="none" stroke="#e0e0e0" stroke-width="3.5"/>' +
                '<circle cx="' + (size/2) + '" cy="' + (size/2) + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="3.5" stroke-dasharray="' + c + '" stroke-dashoffset="' + offset + '" stroke-linecap="round"/>' +
                '</svg>';
            }

            function render() {
              const root = document.getElementById('app');
              const recent6Days = getRecent6DayLabels();

              if (selectedHabitId) {
                const hIdx = habits.findIndex(x => x.id === selectedHabitId);
                if (hIdx === -1) { selectedHabitId = null; render(); return; }
                const h = habits[hIdx];
                const pct = getAppViewRate(h);
                const blockedApps = parseBlockedApps(h);
                const todayDone = isAchieved(h, 0);

                // 현재 선택된 기간(일별/주별/월별/연별)에 따른 시간별 진도 데이터 가져오기
                const progressData = getProgressDataForCurrentPeriod(h);
                const periodTitleMap = { 'day': '일별 시간 진도 (최근 10일)', 'week': '주별 진도 (최근 6주)', 'month': '월별 시간 진도 (월 단위 구분)', 'year': '연별 진도 (연도별)' };

                root.innerHTML =
                  '<div class="detail-header" style="background:' + h.color + '">' +
                    '<div style="display:flex;align-items:center;gap:12px">' +
                      '<span onclick="selectedHabitId=null;render()" style="font-size:22px;cursor:pointer">←</span>' +
                      '<h2 style="font-size:17px">' + h.name + ' (' + (h.type === 'num' ? '기준 ' + h.target + h.unit + ' 이상' : 'On/Off 달성형') + ')</h2>' +
                    '</div>' +
                    '<button class="top-add-btn" style="background:rgba(0,0,0,0.25)" onclick="openHabitEditor(' + hIdx + ')">✎ 수정/삭제</button>' +
                  '</div>' +
                  '<div class="period-tabs">' +
                    ['day','week','month','year'].map(p =>
                      '<button class="period-btn ' + (period===p?'active':'') + '" onclick="setPeriodMode(\'' + p + '\')">' +
                      (p==='day'?'일별':p==='week'?'주별':p==='month'?'월별':'연별') + '</button>'
                    ).join('') +
                  '</div>' +
                  '<div class="card">' +
                    '<div class="card-title" style="color:' + h.color + '">한눈에 보기 (' + (period==='day'?'일별':period==='week'?'주별':period==='month'?'월별':'연별') + ' 달성율)</div>' +
                    '<div class="overview-row">' +
                      '<div>' + ringSvg(pct, h.color, 36) + '</div>' +
                      '<div><div style="font-weight:700">' + h.rateDay + '%</div><div style="font-size:10px;color:#777">일별(오늘)</div></div>' +
                      '<div><div style="font-weight:700">' + h.rateWeek + '%</div><div style="font-size:10px;color:#777">주별(7일)</div></div>' +
                      '<div><div style="font-weight:700">' + h.rateMonth + '%</div><div style="font-size:10px;color:#777">월별(30일)</div></div>' +
                      '<div style="background:#e0f7fa;padding:4px 8px;border-radius:8px"><div style="color:#00838f;font-weight:800">' + h.rate60Days + '%</div><div style="font-size:10px;color:#006064;font-weight:700">위젯(60일)</div></div>' +
                      '<div><div style="font-weight:700">' + h.rateYear + '%</div><div style="font-size:10px;color:#777">연별(1년)</div></div>' +
                    '</div>' +
                  '</div>' +
                  '<div class="card">' +
                    '<div class="card-title" style="color:' + h.color + '">' + (periodTitleMap[period] || '시간별 진도') + '</div>' +
                    '<div style="font-size:11px;color:#666;margin-bottom:4px">버튼을 바꿀 때마다 해당 단위(월별: 9월/10월/11월 등)별 달성 진도가 실시간 반영됩니다.</div>' +
                    '<div class="bar-wrap">' +
                      progressData.map(item =>
                        '<div class="bar-col">' +
                          '<div style="font-size:9px;font-weight:700;color:' + (item.rate > 0 ? h.color : '#999') + ';margin-bottom:2px">' + item.valText + '</div>' +
                          '<div class="bar-fill" style="height:' + Math.max(8, item.rate) + 'px;background:' + h.color + '"></div>' +
                          '<div class="bar-lbl">' + item.label + '</div>' +
                        '</div>'
                      ).join('') +
                    '</div>' +
                  '</div>' +
                  '<div class="card">' +
                    '<div class="card-title" style="color:' + h.color + '">당일(' + getDateInfo(0).shortLabel + ') 상태 및 미달성 시 차단 앱 (' + blockedApps.length + '개)</div>' +
                    '<div style="font-size:13px;line-height:1.6">' +
                      '<div>• 당일 달성 여부: <b style="color:' + (todayDone ? h.color : '#ef4444') + '">' +
                        (todayDone ? '달성 완료 (모든 차단 앱 잠금 해제됨)' : '미달성 (' + (h.type === 'num' ? '현재 ' + h.days[0] + h.unit + ' / 기준 ' + h.target + h.unit : 'Off 상태') + ')') +
                      '</b></div>' +
                      '<div style="margin-top:4px">• 차단 지정된 앱 목록: ' +
                        (blockedApps.length === 0 ? '<b>없음</b>' : blockedApps.map(a => '<span class="app-tag" style="margin-right:4px">🔒 ' + a.name + '</span>').join('')) +
                      '</div>' +
                    '</div>' +
                  '</div>' +
                  '<div class="card">' +
                    '<div class="card-title" style="color:' + h.color + '">최근 60일 날짜별 기록 히트맵 (' + getDateInfo(59).shortLabel + ' ~ ' + getDateInfo(0).shortLabel + ')</div>' +
                    '<div class="grid-60">' +
                      h.days.map((v, dIdx) => {
                        const ok = isAchieved(h, dIdx);
                        const dInfo = getDateInfo(dIdx);
                        return '<div class="grid-60-cell" onclick="handleCellClick(' + hIdx + ',' + dIdx + ')" style="background:' + (ok ? h.color : '#f3f4f6') + ';color:' + (ok ? '#fff' : '#4b5563') + ';border-color:' + (dIdx === 0 ? '#111' : '#e5e7eb') + ';border-width:' + (dIdx === 0 ? '2px' : '1px') + '">' +
                          '<div style="font-size:9px;opacity:0.92">' + dInfo.shortLabel + '</div>' +
                          '<div style="font-size:11px;margin-top:2px">' + (h.type === 'num' ? (v + h.unit) : (ok ? '✓' : '✕')) + '</div>' +
                        '</div>';
                      }).join('') +
                    '</div>' +
                  '</div>';
                return;
              }

              const periodLabel = period==='day'?'일별':period==='week'?'주별':period==='month'?'월별':'연별';

              root.innerHTML =
                '<div class="topbar">' +
                  '<h1>습관 (habbit)</h1>' +
                  '<button class="top-add-btn" onclick="openHabitEditor(-1)">+ 항목 추가</button>' +
                '</div>' +
                '<div class="service-banner ' + (blockerEnabled ? 'on' : 'off') + '">' +
                  '<span>' + (blockerEnabled ? '🛡️ 미달성 시 다중 앱 차단 서비스 작동 중' : '⚠️ 미달성 시 앱 차단을 쓰려면 접근성 권한을 켜주세요') + '</span>' +
                  '<button class="service-btn" onclick="openAccessibility()">' + (blockerEnabled ? '권한 설정' : '권한 켜기') + '</button>' +
                '</div>' +
                '<div class="widget-info-bar">' +
                  '<span>📌 앱 화면: <b>' + periodLabel + ' 시간별 진도</b> 표시 중</span>' +
                  '<span>📱 1x1 홈 위젯: <b>최근 60일 달성율</b> 고정 표시</span>' +
                '</div>' +
                '<div class="period-tabs">' +
                  ['day','week','month','year'].map(p =>
                    '<button class="period-btn ' + (period===p?'active':'') + '" onclick="setPeriodMode(\'' + p + '\')">' +
                    (p==='day'?'일별 진도':p==='week'?'주별 진도':p==='month'?'월별 진도':'연별 진도') + '</button>'
                  ).join('') +
                '</div>' +
                '<div class="header-row">' +
                  '<div class="habit-col">목표 (' + periodLabel + ' 진도 / 위젯 60일)</div>' +
                  recent6Days.map(d => '<div class="day-col">' + d[0] + '<br>' + d[1] + '</div>').join('') +
                '</div>' +
                habits.map((h, hIdx) => {
                  const blockedApps = parseBlockedApps(h);
                  const blockLabel = blockedApps.length > 0
                    ? (' · 🔒' + blockedApps[0].name + (blockedApps.length > 1 ? ' 외 ' + (blockedApps.length - 1) + '개' : ''))
                    : '';
                  const subText = (h.type === 'num' ? ('기준 ' + h.target + h.unit) : 'On/Off') +
                    ' · 위젯60일:' + h.rate60Days + '%' + blockLabel;
                  return '<div class="habit-card">' +
                    '<div class="habit-info">' +
                      '<button class="edit-icon-btn" onclick="openHabitEditor(' + hIdx + ')">✎</button>' +
                      '<div onclick="selectedHabitId=\'' + h.id + '\';render()" style="display:flex;align-items:center;gap:7px;overflow:hidden;flex:1;cursor:pointer">' +
                        ringSvg(getAppViewRate(h), h.color, 26) +
                        '<div class="habit-meta">' +
                          '<div class="habit-name-row"><span class="habit-name" style="color:' + h.color + '">' + h.name + '</span></div>' +
                          '<div class="habit-sub">' + subText + '</div>' +
                        '</div>' +
                      '</div>' +
                    '</div>' +
                    h.days.slice(0, 6).map((v, dIdx) => {
                      const passed = isAchieved(h, dIdx);
                      const cellColor = passed ? h.color : (v > 0 ? '#f59e0b' : '#ccc');
                      let cellContent = '';
                      if (h.type === 'num') {
                        cellContent = '<div>' + v + '<span style="font-size:9px">' + h.unit + '</span></div>' +
                          '<div style="font-size:8px;color:' + (passed ? h.color : '#999') + '">' + (passed ? '달성' : '미달') + '</div>';
                      } else {
                        cellContent = v > 0 ? '✓' : '✕';
                      }
                      return '<button class="cell-btn" style="color:' + cellColor + '" onclick="handleCellClick(' + hIdx + ',' + dIdx + ')">' +
                        cellContent +
                      '</button>';
                    }).join('') +
                  '</div>';
                }).join('') +
                '<button class="fab" onclick="openHabitEditor(-1)">+</button>';
            }

            loadData();
          </script>
          </body>
          </html>
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload habbit APK
        uses: actions/upload-artifact@v4
        with:
          name: habbit-apk
          path: app/build/outputs/apk/debug/app-debug.apk
