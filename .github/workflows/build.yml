          cat << 'EOF' > app/src/main/java/com/example/habbit/MainActivity.kt
          package com.example.habbit

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.text.TextUtils
          import android.view.ViewGroup
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.FrameLayout
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import org.json.JSONArray
          import org.json.JSONObject
          import java.time.LocalDate

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              private var isPageLoaded = false
              private var pendingBackupJson: String? = null

              companion object {
                  private const val REQ_EXPORT_BACKUP = 2001
                  private const val REQ_IMPORT_BACKUP = 2002
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val container = FrameLayout(this).apply {
                      layoutParams = ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  }

                  webView = WebView(this).apply {
                      layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.allowFileAccess = true
                      settings.allowContentAccess = true
                      webChromeClient = WebChromeClient()
                      webViewClient = object : WebViewClient() {
                          override fun onPageFinished(view: WebView?, url: String?) {
                              super.onPageFinished(view, url)
                              isPageLoaded = true
                              evaluateJavascript("window.refreshFromAndroid && window.refreshFromAndroid();", null)
                          }
                      }
                      addJavascriptInterface(AndroidBridge(), "AndroidBridge")
                  }

                  container.addView(webView)
                  setContentView(container)

                  val htmlContent = try {
                      assets.open("index.html").bufferedReader(Charsets.UTF_8).use { it.readText() }
                  } catch (e: Exception) {
                      "<html><body><h2>앱 리소스를 불러오지 못했습니다.</h2></body></html>"
                  }
                  webView.loadDataWithBaseURL("https://habbit.local/", htmlContent, "text/html", "UTF-8", null)
              }

              override fun onResume() {
                  super.onResume()
                  if (isPageLoaded) {
                      webView.evaluateJavascript("window.refreshFromAndroid && window.refreshFromAndroid();", null)
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQ_EXPORT_BACKUP && resultCode == Activity.RESULT_OK) {
                      val uri = data?.data
                      val content = pendingBackupJson
                      if (uri != null && !content.isNullOrBlank()) {
                          try {
                              contentResolver.openOutputStream(uri)?.use { out ->
                                  out.write(content.toByteArray(Charsets.UTF_8))
                              }
                              Toast.makeText(this, "백업 파일이 성공적으로 저장되었습니다.", Toast.LENGTH_LONG).show()
                          } catch (e: Exception) {
                              Toast.makeText(this, "백업 파일 저장 실패: ${e.message}", Toast.LENGTH_LONG).show()
                          }
                      }
                  } else if (requestCode == REQ_IMPORT_BACKUP && resultCode == Activity.RESULT_OK) {
                      val uri = data?.data
                      if (uri != null) {
                          try {
                              val rawText = contentResolver.openInputStream(uri)?.bufferedReader(Charsets.UTF_8)?.use { it.readText() } ?: ""
                              val extractedHabitsJson = extractValidHabitsArray(rawText)
                              if (extractedHabitsJson != null) {
                                  HabbitStorage.saveHabitsJson(this, extractedHabitsJson)
                                  webView.evaluateJavascript("window.onBackupRestoredFromNative && window.onBackupRestoredFromNative();", null)
                                  Toast.makeText(this, "백업 데이터를 성공적으로 불러왔습니다!", Toast.LENGTH_LONG).show()
                              } else {
                                  Toast.makeText(this, "유효하지 않은 백업 파일 형식입니다.", Toast.LENGTH_LONG).show()
                              }
                          } catch (e: Exception) {
                              Toast.makeText(this, "백업 파일 읽기 실패: ${e.message}", Toast.LENGTH_LONG).show()
                          }
                      }
                  }
              }

              private fun extractValidHabitsArray(raw: String): String? {
                  val trimmed = raw.trim()
                  return try {
                      if (trimmed.startsWith("{")) {
                          val obj = JSONObject(trimmed)
                          if (obj.has("habits")) {
                              obj.getJSONArray("habits").toString()
                          } else null
                      } else if (trimmed.startsWith("[")) {
                          val arr = JSONArray(trimmed)
                          if (arr.length() >= 0) arr.toString() else null
                      } else null
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun isAccessibilityServiceEnabled(): Boolean {
                  return try {
                      val expectedComponentName = "$packageName/${HabbitBlockerService::class.java.canonicalName}"
                      val enabledServices = Settings.Secure.getString(
                          contentResolver,
                          Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                      ) ?: return false
                      val splitter = TextUtils.SimpleStringSplitter(':')
                      splitter.setString(enabledServices)
                      while (splitter.hasNext()) {
                          val component = splitter.next()
                          if (component.equals(expectedComponentName, ignoreCase = true)) {
                              return true
                          }
                      }
                      false
                  } catch (e: Exception) {
                      false
                  }
              }

              inner class AndroidBridge {
                  @JavascriptInterface
                  fun getHabitsJson(): String {
                      return try {
                          val list = HabbitStorage.getHabits(this@MainActivity)
                          val arr = JSONArray()
                          for (h in list) {
                              val o = JSONObject()
                              o.put("id", h.id)
                              o.put("name", h.name)
                              o.put("color", h.color)
                              o.put("type", h.type)
                              o.put("unit", h.unit)
                              o.put("target", h.target)
                              o.put("blockedPkg", h.blockedPkg)
                              o.put("blockedAppName", h.blockedAppName)
                              val d = JSONArray()
                              h.days.forEach { d.put(it) }
                              o.put("days", d)
                              o.put("history", h.history)
                              o.put("rateDay", h.rateDay)
                              o.put("rateWeek", h.rateWeek)
                              o.put("rateMonth", h.rateMonth)
                              o.put("rateYear", h.rateYear)
                              o.put("rate60Days", h.rate60Days)
                              arr.put(o)
                          }
                          arr.toString()
                      } catch (e: Exception) {
                          HabbitStorage.defaultJson()
                      }
                  }

                  @JavascriptInterface
                  fun saveHabits(jsonStr: String) {
                      HabbitStorage.saveHabitsJson(this@MainActivity, jsonStr)
                  }

                  @JavascriptInterface
                  fun getPeriod(): String = HabbitStorage.getPeriod(this@MainActivity)

                  @JavascriptInterface
                  fun setPeriod(p: String) {
                      HabbitStorage.setPeriod(this@MainActivity, p)
                  }

                  @JavascriptInterface
                  fun isBlockerServiceEnabled(): Boolean {
                      return isAccessibilityServiceEnabled()
                  }

                  @JavascriptInterface
                  fun openAccessibilitySettings() {
                      try {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      } catch (e: Exception) {}
                  }

                  @JavascriptInterface
                  fun exportBackupToFile(backupJsonStr: String) {
                      try {
                          pendingBackupJson = backupJsonStr
                          val fileName = "habbit_backup_${LocalDate.now()}.json"
                          val intent = Intent(Intent.ACTION_CREATE_DOCUMENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "application/json"
                              putExtra(Intent.EXTRA_TITLE, fileName)
                          }
                          startActivityForResult(intent, REQ_EXPORT_BACKUP)
                      } catch (e: Exception) {
                          runOnUiThread {
                              Toast.makeText(this@MainActivity, "파일 저장 창을 열 수 없습니다: ${e.message}", Toast.LENGTH_LONG).show()
                          }
                      }
                  }

                  @JavascriptInterface
                  fun importBackupFromFile() {
                      try {
                          val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "*/*"
                          }
                          startActivityForResult(intent, REQ_IMPORT_BACKUP)
                      } catch (e: Exception) {
                          runOnUiThread {
                              Toast.makeText(this@MainActivity, "파일 선택 창을 열 수 없습니다: ${e.message}", Toast.LENGTH_LONG).show()
                          }
                      }
                  }

                  @JavascriptInterface
                  fun copyBackupToClipboard(text: String): Boolean {
                      return try {
                          val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          cm.setPrimaryClip(ClipData.newPlainText("habbit_backup", text))
                          runOnUiThread {
                              Toast.makeText(this@MainActivity, "백업 데이터가 클립보드에 복사되었습니다.", Toast.LENGTH_SHORT).show()
                          }
                          true
                      } catch (e: Exception) {
                          false
                      }
                  }

                  @JavascriptInterface
                  fun getInstalledAppsJson(): String {
                      return try {
                          val pm = packageManager
                          val mainIntent = Intent(Intent.ACTION_MAIN, null).apply {
                              addCategory(Intent.CATEGORY_LAUNCHER)
                          }
                          val resolveInfos = pm.queryIntentActivities(mainIntent, 0)
                          val arr = JSONArray()
                          val seen = mutableSetOf<String>()
                          for (ri in resolveInfos) {
                              val pkg = ri.activityInfo?.packageName ?: continue
                              if (pkg != packageName && seen.add(pkg)) {
                                  val label = try {
                                      ri.loadLabel(pm).toString()
                                          .replace("\n", " ")
                                          .replace("\r", " ")
                                          .trim()
                                  } catch (e: Exception) {
                                      pkg
                                  }
                                  val o = JSONObject()
                                  o.put("pkg", pkg)
                                  o.put("name", label)
                                  arr.put(o)
                              }
                          }
                          arr.toString()
                      } catch (e: Exception) {
                          "[]"
                      }
                  }
              }
          }
