          <body>
          <div id="app"></div>
          <div id="modal-root"></div>

          <script>
            let habits = [];
            let period = 'month';
            let selectedHabitId = null;
            let blockerEnabled = false;
            let installedApps = [];
            const dayLabels = [['일',8],['토',7],['금',6],['목',5],['수',4],['화',3]];
            const palette = ['#00acc1','#fb8c00','#7cb342','#d81b60','#8e24aa','#1e88e5','#e53935','#3949ab'];
            const presetApps = [
              { name: '차단 안 함', pkg: '' },
              { name: 'YouTube', pkg: 'com.google.android.youtube' },
              { name: 'Instagram', pkg: 'com.instagram.android' },
              { name: '카카오톡', pkg: 'com.kakao.talk' },
              { name: 'TikTok', pkg: 'com.zhiliaoapp.musically' },
              { name: 'Chrome', pkg: 'com.android.chrome' },
              { name: 'Netflix', pkg: 'com.netflix.mediaclient' },
              { name: '네이버 웹툰', pkg: 'com.nhn.android.webtoon' }
            ];

            function isAchieved(h, dayIdx) {
              const val = h.days[dayIdx] || 0;
              if (h.type === 'num') {
                return val >= (h.target || 1);
              }
              return val > 0;
            }

            function recalcRates(h) {
              const doneCount = h.days.filter((_, idx) => isAchieved(h, idx)).length;
              h.rateDay = isAchieved(h, 0) ? 100 : 0;
              h.rateWeek = Math.round((doneCount / h.days.length) * 100);
            }

            function loadData() {
              if (window.AndroidBridge) {
                habits = JSON.parse(window.AndroidBridge.getHabitsJson());
                period = window.AndroidBridge.getPeriod();
                blockerEnabled = window.AndroidBridge.isBlockerServiceEnabled();
                try {
                  installedApps = JSON.parse(window.AndroidBridge.getInstalledAppsJson());
                } catch (e) { installedApps = []; }
              }
              render();
            }
            window.refreshFromAndroid = loadData;

            function saveAll() {
              if (window.AndroidBridge) {
                window.AndroidBridge.saveHabits(JSON.stringify(habits));
              }
              render();
            }

            function getRate(h) {
              if (period === 'day') return isAchieved(h, 0) ? 100 : 0;
              if (period === 'week') return h.rateWeek;
              if (period === 'year') return h.rateYear;
              return h.rateMonth;
            }

            function setPeriodMode(p) {
              period = p;
              if (window.AndroidBridge) window.AndroidBridge.setPeriod(p);
              render();
            }

            function handleCellClick(hIdx, dIdx) {
              const h = habits[hIdx];
              if (h.type === 'num') {
                openNumberInputModal(hIdx, dIdx);
              } else {
                h.days[dIdx] = h.days[dIdx] > 0 ? 0 : 1;
                recalcRates(h);
                saveAll();
              }
            }

            function openNumberInputModal(hIdx, dIdx) {
              const h = habits[hIdx];
              const curVal = h.days[dIdx] || 0;
              const dayName = dayLabels[dIdx][0] + '요일(' + dayLabels[dIdx][1] + '일)';
              const modalRoot = document.getElementById('modal-root');
              modalRoot.innerHTML =
                '<div class="modal-backdrop" onclick="closeModal()">' +
                  '<div class="modal-box" onclick="event.stopPropagation()">' +
                    '<div class="modal-title">[' + h.name + '] ' + dayName + ' 수치 기록</div>' +
                    '<div style="font-size:12px;color:#555;margin-bottom:12px;">' +
                      '달성 기준: <b style="color:' + h.color + '">' + h.target + (h.unit || '') + ' 이상</b> 기록 시 달성(PASS)' +
                    '</div>' +
                    '<div class="form-group">' +
                      '<label class="form-label">기록할 수치 (' + (h.unit || '단위 없음') + ')</label>' +
                      '<input id="num-val-input" type="number" class="form-input" value="' + curVal + '" min="0" />' +
                    '</div>' +
                    '<div class="preset-chips">' +
                      [0, 1, 3, h.target, h.target + 2, h.target * 2].map(v =>
                        '<button type="button" class="chip" onclick="document.getElementById(\'num-val-input\').value=' + v + '">' + v + (h.unit || '') + '</button>'
                      ).join('') +
                    '</div>' +
                    '<div class="btn-row">' +
                      '<button class="btn btn-secondary" onclick="closeModal()">취소</button>' +
                      '<button class="btn btn-primary" onclick="saveNumberInput(' + hIdx + ',' + dIdx + ')">저장</button>' +
                    '</div>' +
                  '</div>' +
                '</div>';
            }

            function saveNumberInput(hIdx, dIdx) {
              const val = parseInt(document.getElementById('num-val-input').value, 10);
              const h = habits[hIdx];
              h.days[dIdx] = isNaN(val) || val < 0 ? 0 : val;
              recalcRates(h);
              closeModal();
              saveAll();
            }

            let draftHabit = null;
            let editingIndex = -1;

            function openHabitEditor(hIdx) {
              editingIndex = hIdx;
              if (hIdx >= 0) {
                const src = habits[hIdx];
                draftHabit = JSON.parse(JSON.stringify(src));
              } else {
                draftHabit = {
                  id: 'h_' + Date.now(),
                  name: '',
                  color: palette[habits.length % palette.length],
                  type: 'bool',
                  unit: '장',
                  target: 5,
                  blockedPkg: '',
                  blockedAppName: '',
                  days: [0,0,0,0,0,0],
                  rateDay: 0, rateWeek: 0, rateMonth: 50, rateYear: 50
                };
              }
              renderEditorModal();
            }

            function syncDraftFields() {
              const nameEl = document.getElementById('ed-name');
              if (nameEl) draftHabit.name = nameEl.value;
              const targetEl = document.getElementById('ed-target');
              if (targetEl) draftHabit.target = Math.max(1, parseInt(targetEl.value, 10) || 1);
              const unitEl = document.getElementById('ed-unit');
              if (unitEl) draftHabit.unit = unitEl.value;
              const pkgEl = document.getElementById('ed-pkg');
              if (pkgEl) draftHabit.blockedPkg = pkgEl.value.trim();
              const appNameEl = document.getElementById('ed-app-name');
              if (appNameEl) draftHabit.blockedAppName = appNameEl.value.trim();
            }

            function selectDraftType(t) {
              syncDraftFields();
              draftHabit.type = t;
              renderEditorModal();
            }

            function selectDraftColor(c) {
              syncDraftFields();
              draftHabit.color = c;
              renderEditorModal();
            }

            function selectPresetApp(pkg, name) {
              syncDraftFields();
              draftHabit.blockedPkg = pkg;
              draftHabit.blockedAppName = pkg ? name : '';
              renderEditorModal();
            }

            function onInstalledAppSelected(sel) {
              syncDraftFields();
              const pkg = sel.value;
              const optName = sel.options[sel.selectedIndex].text;
              draftHabit.blockedPkg = pkg;
              draftHabit.blockedAppName = pkg ? optName : '';
              renderEditorModal();
            }

            function renderEditorModal() {
              const modalRoot = document.getElementById('modal-root');
              const isEdit = editingIndex >= 0;
              modalRoot.innerHTML =
                '<div class="modal-backdrop" onclick="closeModal()">' +
                  '<div class="modal-box" onclick="event.stopPropagation()">' +
                    '<div class="modal-title">' + (isEdit ? '항목 이름·속성 수정 및 삭제' : '새 목표 항목 추가') + '</div>' +
                    '<div class="form-group">' +
                      '<label class="form-label">1. 항목 이름</label>' +
                      '<input id="ed-name" class="form-input" placeholder="예: 독서, 운동, 물 마시기" value="' + (draftHabit.name || '') + '" />' +
                    '</div>' +
                    '<div class="form-group">' +
                      '<label class="form-label">2. 항목 달성 속성 (On/Off vs 기준 수치 체크)</label>' +
                      '<div class="type-selector">' +
                        '<div class="type-opt ' + (draftHabit.type === 'bool' ? 'selected' : '') + '" onclick="selectDraftType(\'bool\')">' +
                          '✓ On/Off 달성형<br><span style="font-size:10px;font-weight:400">달성 여부만 체크</span>' +
                        '</div>' +
                        '<div class="type-opt ' + (draftHabit.type === 'num' ? 'selected' : '') + '" onclick="selectDraftType(\'num\')">' +
                          '123 수치 기준 체크형<br><span style="font-size:10px;font-weight:400">일정 수치 이상 달성 체크</span>' +
                        '</div>' +
                      '</div>' +
                    '</div>' +
                    (draftHabit.type === 'num' ? (
                      '<div class="form-group" style="background:#f0fdf4;padding:10px;border-radius:8px;border:1px solid #bbf7d0">' +
                        '<label class="form-label" style="color:#166534">기준 수치 설정 (이 수치를 넘어야 당일 달성 인정)</label>' +
                        '<div style="display:flex;gap:8px">' +
                          '<div style="flex:1">' +
                            '<span style="font-size:11px;color:#555">목표 기준 수치</span>' +
                            '<input id="ed-target" type="number" min="1" class="form-input" value="' + draftHabit.target + '" />' +
                          '</div>' +
                          '<div style="flex:1">' +
                            '<span style="font-size:11px;color:#555">단위 (예: 장, 분, 잔)</span>' +
                            '<input id="ed-unit" class="form-input" value="' + (draftHabit.unit || '') + '" placeholder="장" />' +
                          '</div>' +
                        '</div>' +
                      '</div>'
                    ) : '') +
                    '<div class="form-group">' +
                      '<label class="form-label">3. 테마 색상</label>' +
                      '<div class="color-row">' +
                        palette.map(c =>
                          '<div class="color-dot ' + (draftHabit.color === c ? 'selected' : '') + '" style="background:' + c + '" onclick="selectDraftColor(\'' + c + '\')"></div>'
                        ).join('') +
                      '</div>' +
                    '</div>' +
                    '<div class="form-group" style="background:#fff1f2;padding:10px;border-radius:8px;border:1px solid #fecdd3">' +
                      '<label class="form-label" style="color:#be123c">4. 당일 미달성 시 실행 차단할 App 지정</label>' +
                      '<div class="preset-chips">' +
                        presetApps.map(p =>
                          '<button type="button" class="chip ' + (draftHabit.blockedPkg === p.pkg ? 'active' : '') + '" onclick="selectPresetApp(\'' + p.pkg + '\',\'' + p.name + '\')">' + p.name + '</button>'
                        ).join('') +
                      '</div>' +
                      (installedApps.length > 0 ? (
                        '<select class="form-select" style="margin-bottom:6px" onchange="onInstalledAppSelected(this)">' +
                          '<option value="">-- 내 폰에 설치된 앱에서 선택 --</option>' +
                          installedApps.map(a =>
                            '<option value="' + a.pkg + '" ' + (draftHabit.blockedPkg === a.pkg ? 'selected' : '') + '>' + a.name + '</option>'
                          ).join('') +
                        '</select>'
                      ) : '') +
                      '<input id="ed-app-name" class="form-input" style="margin-bottom:6px" placeholder="차단 앱 표시 이름 (예: YouTube)" value="' + (draftHabit.blockedAppName || '') + '" />' +
                      '<input id="ed-pkg" class="form-input" placeholder="패키지명 (예: com.google.android.youtube)" value="' + (draftHabit.blockedPkg || '') + '" />' +
                    '</div>' +
                    '<div class="btn-row">' +
                      (isEdit ? '<button class="btn btn-danger" onclick="deleteHabit(' + editingIndex + ')">삭제</button>' : '') +
                      '<button class="btn btn-secondary" onclick="closeModal()">취소</button>' +
                      '<button class="btn btn-primary" onclick="saveHabitEditor()">저장</button>' +
                    '</div>' +
                  '</div>' +
                '</div>';
            }

            function saveHabitEditor() {
              syncDraftFields();
              if (!draftHabit.name || !draftHabit.name.trim()) {
                alert('항목 이름을 입력해주세요.');
                return;
              }
              draftHabit.name = draftHabit.name.trim();
              recalcRates(draftHabit);
              if (editingIndex >= 0) {
                habits[editingIndex] = draftHabit;
              } else {
                habits.push(draftHabit);
              }
              closeModal();
              saveAll();
            }

            function deleteHabit(idx) {
              const target = habits[idx];
              if (!confirm('[' + target.name + '] 항목을 삭제하시겠습니까?')) return;
              habits.splice(idx, 1);
              if (selectedHabitId === target.id) selectedHabitId = null;
              closeModal();
              saveAll();
            }

            function closeModal() {
              document.getElementById('modal-root').innerHTML = '';
            }

            function openAccessibility() {
              if (window.AndroidBridge) {
                window.AndroidBridge.openAccessibilitySettings();
              }
            }

            function ringSvg(pct, color, size) {
              const r = (size - 6) / 2;
              const c = 2 * Math.PI * r;
              const offset = c - (pct / 100) * c;
              return '<svg width="' + size + '" height="' + size + '" style="transform:rotate(-90deg);flex-shrink:0">' +
                '<circle cx="' + (size/2) + '" cy="' + (size/2) + '" r="' + r + '" fill="none" stroke="#e0e0e0" stroke-width="3.5"/>' +
                '<circle cx="' + (size/2) + '" cy="' + (size/2) + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="3.5" stroke-dasharray="' + c + '" stroke-dashoffset="' + offset + '" stroke-linecap="round"/>' +
                '</svg>';
            }

            function render() {
              const root = document.getElementById('app');
              if (selectedHabitId) {
                const hIdx = habits.findIndex(x => x.id === selectedHabitId);
                if (hIdx === -1) { selectedHabitId = null; render(); return; }
                const h = habits[hIdx];
                const pct = getRate(h);
                const bars = [14,22,25,18,12,21,24,26,19,22,15,pct];
                const todayDone = isAchieved(h, 0);
                root.innerHTML =
                  '<div class="detail-header" style="background:' + h.color + '">' +
                    '<div style="display:flex;align-items:center;gap:12px">' +
                      '<span onclick="selectedHabitId=null;render()" style="font-size:22px;cursor:pointer">←</span>' +
                      '<h2 style="font-size:18px">' + h.name + ' (' + (h.type === 'num' ? '기준 ' + h.target + h.unit + ' 이상' : 'On/Off 달성형') + ')</h2>' +
                    '</div>' +
                    '<button class="top-add-btn" style="background:rgba(0,0,0,0.25)" onclick="openHabitEditor(' + hIdx + ')">✎ 수정/삭제</button>' +
                  '</div>' +
                  '<div class="period-tabs">' +
                    ['day','week','month','year'].map(p =>
                      '<button class="period-btn ' + (period===p?'active':'') + '" onclick="setPeriodMode(\'' + p + '\')">' +
                      (p==='day'?'일별':p==='week'?'주별':p==='month'?'월별':'연별') + '</button>'
                    ).join('') +
                  '</div>' +
                  '<div class="card">' +
                    '<div class="card-title" style="color:' + h.color + '">당일 상태 및 앱 차단 설정</div>' +
                    '<div style="font-size:13px;line-height:1.6">' +
                      '<div>• 당일 달성 여부: <b style="color:' + (todayDone ? h.color : '#ef4444') + '">' +
                        (todayDone ? '달성 완료 (잠금 해제됨)' : '미달성 (' + (h.type === 'num' ? '현재 ' + h.days[0] + h.unit + ' / 기준 ' + h.target + h.unit : 'Off 상태') + ')') +
                      '</b></div>' +
                      '<div>• 미달성 시 차단 앱: <b>' + (h.blockedPkg ? (h.blockedAppName || h.blockedPkg) : '지정 안 됨') + '</b></div>' +
                    '</div>' +
                  '</div>' +
                  '<div class="card">' +
                    '<div class="card-title" style="color:' + h.color + '">한눈에 보기</div>' +
                    '<div class="overview-row">' +
                      '<div>' + ringSvg(pct, h.color, 34) + '</div>' +
                      '<div><div style="color:' + h.color + ';font-weight:700">' + pct + '%</div><div style="font-size:11px;color:#777">현재 달성율</div></div>' +
                      '<div><div style="font-weight:700">' + h.rateWeek + '%</div><div style="font-size:11px;color:#777">주간</div></div>' +
                      '<div><div style="font-weight:700">' + h.rateMonth + '%</div><div style="font-size:11px;color:#777">월간</div></div>' +
                      '<div><div style="font-weight:700">' + h.rateYear + '%</div><div style="font-size:11px;color:#777">연간</div></div>' +
                    '</div>' +
                  '</div>' +
                  '<div class="card">' +
                    '<div class="card-title" style="color:' + h.color + '">기간별 달성 이력 (' + (period==='day'?'일별':period==='week'?'주별':period==='month'?'월별':'연별') + ')</div>' +
                    '<div class="bar-wrap">' +
                      bars.map((v,i) =>
                        '<div class="bar-col">' +
                          '<div style="font-size:9px;color:#777;margin-bottom:2px">' + v + '</div>' +
                          '<div class="bar-fill" style="height:' + Math.max(8, v) + 'px;background:' + h.color + '"></div>' +
                          '<div class="bar-lbl">' + (i+1) + '</div>' +
                        '</div>'
                      ).join('') +
                    '</div>' +
                  '</div>';
                return;
              }

              root.innerHTML =
                '<div class="topbar">' +
                  '<h1>습관 (habbit)</h1>' +
                  '<button class="top-add-btn" onclick="openHabitEditor(-1)">+ 항목 추가</button>' +
                '</div>' +
                '<div class="service-banner ' + (blockerEnabled ? 'on' : 'off') + '">' +
                  '<span>' + (blockerEnabled ? '🛡️ 미달성 시 특정 앱 차단 서비스가 작동 중입니다' : '⚠️ 미달성 시 앱 차단 기능을 쓰려면 접근성 권한을 켜주세요') + '</span>' +
                  '<button class="service-btn" onclick="openAccessibility()">' + (blockerEnabled ? '권한 설정' : '권한 켜기') + '</button>' +
                '</div>' +
                '<div class="period-tabs">' +
                  ['day','week','month','year'].map(p =>
                    '<button class="period-btn ' + (period===p?'active':'') + '" onclick="setPeriodMode(\'' + p + '\')">' +
                    (p==='day'?'일별 달성율':p==='week'?'주별 달성율':p==='month'?'월별 달성율':'연별 달성율') + '</button>'
                  ).join('') +
                '</div>' +
                '<div class="header-row">' +
                  '<div class="habit-col">목표 (이름 터치: 통계 / ✎: 수정)</div>' +
                  dayLabels.map(d => '<div class="day-col">' + d[0] + '<br>' + d[1] + '</div>').join('') +
                '</div>' +
                habits.map((h, hIdx) => {
                  const subText = (h.type === 'num' ? ('기준: ' + h.target + h.unit + ' 이상') : 'On/Off 체크') +
                    (h.blockedPkg ? (' · 🔒' + (h.blockedAppName || '앱차단')) : '');
                  return '<div class="habit-card">' +
                    '<div class="habit-info">' +
                      '<button class="edit-icon-btn" onclick="openHabitEditor(' + hIdx + ')">✎</button>' +
                      '<div onclick="selectedHabitId=\'' + h.id + '\';render()" style="display:flex;align-items:center;gap:7px;overflow:hidden;flex:1;cursor:pointer">' +
                        ringSvg(getRate(h), h.color, 24) +
                        '<div class="habit-meta">' +
                          '<div class="habit-name-row"><span class="habit-name" style="color:' + h.color + '">' + h.name + '</span></div>' +
                          '<div class="habit-sub">' + subText + '</div>' +
                        '</div>' +
                      '</div>' +
                    '</div>' +
                    h.days.map((v, dIdx) => {
                      const passed = isAchieved(h, dIdx);
                      const cellColor = passed ? h.color : (v > 0 ? '#f59e0b' : '#ccc');
                      let cellContent = '';
                      if (h.type === 'num') {
                        cellContent = '<div>' + v + '<span style="font-size:9px">' + h.unit + '</span></div>' +
                          '<div style="font-size:8px;color:' + (passed ? h.color : '#999') + '">' + (passed ? '달성' : '미달') + '</div>';
                      } else {
                        cellContent = v > 0 ? '✓' : '✕';
                      }
                      return '<button class="cell-btn" style="color:' + cellColor + '" onclick="handleCellClick(' + hIdx + ',' + dIdx + ')">' +
                        cellContent +
                      '</button>';
                    }).join('') +
                  '</div>';
                }).join('') +
                '<button class="fab" onclick="openHabitEditor(-1)">+</button>';
            }

            loadData();
          </script>
          </body>
          </html>
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload habbit APK
        uses: actions/upload-artifact@v4
        with:
          name: habbit-apk
          path: app/build/outputs/apk/debug/app-debug.apk
