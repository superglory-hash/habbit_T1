name: Build Habbit APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Android Project & App Blocker Code
        run: |
          mkdir -p app/src/main/java/com/example/habbit
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "habbit"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.habbit'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.habbit"
                  minSdk 26
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">habbit</string>
              <string name="accessibility_service_desc">당일 목표를 달성하지 못했을 때 지정된 앱의 실행을 감지하고 차단하기 위해 사용됩니다.</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#00ACC1" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M54,24A30,30 0,1 1,24 54A30,30 0,0 1,54 24M54,32A22,22 0,1 0,76 54A22,22 0,0 0,54 32Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M48,60L38,50L42,46L48,52L66,34L70,38Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/layout/widget_habbit_1x1.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:padding="2dp">
              <ImageView
                  android:id="@+id/widget_canvas"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="fitCenter" />
          </FrameLayout>
          EOF

          cat << 'EOF' > app/src/main/res/xml/habbit_widget_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="50dp"
              android:minHeight="50dp"
              android:targetCellWidth="1"
              android:targetCellHeight="1"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_habbit_1x1"
              android:configure="com.example.habbit.WidgetConfigActivity"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="false"
              android:description="@string/accessibility_service_desc"
              android:notificationTimeout="100" />
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".BlockedAppActivity"
                      android:exported="true"
                      android:launchMode="singleInstance"
                      android:excludeFromRecents="true" />

                  <activity
                      android:name=".WidgetConfigActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_CONFIGURE" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".HabbitBlockerService"
                      android:exported="true"
                      android:label="habbit 미달성 앱 차단 서비스"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <receiver
                      android:name=".HabbitWidgetProvider"
                      android:exported="true"
                      android:label="habbit 1x1 목표 위젯">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="com.example.habbit.ACTION_TOGGLE_HABIT" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/habbit_widget_info" />
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/habbit/HabbitStorage.kt
          package com.example.habbit

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          data class HabitItem(
              val id: String,
              val name: String,
              val color: String,
              val type: String, // "bool" (On/Off) or "num" (수치 기준 체크)
              val unit: String,
              val target: Int,  // 수치형 달성 기준값 (이 값 이상이어야 달성으로 인정)
              val blockedPkg: String, // 당일 미달성 시 차단할 앱 패키지명
              val blockedAppName: String,
              val days: IntArray, // 최근 6일 기록 (index 0 = 오늘)
              val rateDay: Int,
              val rateWeek: Int,
              val rateMonth: Int,
              val rateYear: Int
          )

          object HabbitStorage {
              private const val PREF_NAME = "habbit_prefs"
              private const val KEY_HABITS = "habits_json_v2"
              private const val KEY_PERIOD = "selected_period"

              fun isAchievedOnDay(item: HabitItem, dayIndex: Int = 0): Boolean {
                  if (item.days.isEmpty() || dayIndex !in item.days.indices) return false
                  val v = item.days[dayIndex]
                  return if (item.type == "num") {
                      v >= item.target.coerceAtLeast(1)
                  } else {
                      v > 0
                  }
              }

              fun getPeriod(context: Context): String {
                  return context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                      .getString(KEY_PERIOD, "month") ?: "month"
              }

              fun setPeriod(context: Context, period: String) {
                  context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                      .edit().putString(KEY_PERIOD, period).apply()
                  HabbitWidgetProvider.updateAllWidgets(context)
              }

              fun getHabits(context: Context): List<HabitItem> {
                  val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                  var raw = prefs.getString(KEY_HABITS, null)
                  if (raw == null) {
                      raw = defaultJson()
                      prefs.edit().putString(KEY_HABITS, raw).apply()
                  }
                  val list = mutableListOf<HabitItem>()
                  val arr = JSONArray(raw)
                  for (i in 0 until arr.length()) {
                      val o = arr.getJSONObject(i)
                      val dArr = o.getJSONArray("days")
                      val days = IntArray(dArr.length()) { idx -> dArr.getInt(idx) }
                      list.add(
                          HabitItem(
                              id = o.getString("id"),
                              name = o.getString("name"),
                              color = o.getString("color"),
                              type = o.optString("type", "bool"),
                              unit = o.optString("unit", ""),
                              target = o.optInt("target", 1).coerceAtLeast(1),
                              blockedPkg = o.optString("blockedPkg", ""),
                              blockedAppName = o.optString("blockedAppName", ""),
                              days = days,
                              rateDay = o.optInt("rateDay", 50),
                              rateWeek = o.optInt("rateWeek", 50),
                              rateMonth = o.optInt("rateMonth", 50),
                              rateYear = o.optInt("rateYear", 50)
                          )
                      )
                  }
                  return list
              }

              fun saveHabitsJson(context: Context, jsonStr: String) {
                  context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                      .edit().putString(KEY_HABITS, jsonStr).apply()
                  HabbitWidgetProvider.updateAllWidgets(context)
              }

              fun toggleTodayFromWidget(context: Context, habitId: String) {
                  val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                  val raw = prefs.getString(KEY_HABITS, defaultJson()) ?: defaultJson()
                  val arr = JSONArray(raw)
                  for (i in 0 until arr.length()) {
                      val o = arr.getJSONObject(i)
                      if (o.getString("id") == habitId) {
                          val dArr = o.getJSONArray("days")
                          val type = o.optString("type", "bool")
                          val target = o.optInt("target", 1).coerceAtLeast(1)
                          val cur = dArr.getInt(0)
                          val next = if (type == "num") {
                              if (cur >= target * 2) 0 else cur + 1
                          } else {
                              if (cur > 0) 0 else 1
                          }
                          dArr.put(0, next)
                          val doneCount = (0 until dArr.length()).count { idx ->
                              val v = dArr.getInt(idx)
                              if (type == "num") v >= target else v > 0
                          }
                          val todayAchieved = if (type == "num") next >= target else next > 0
                          val weekPct = ((doneCount.toFloat() / dArr.length()) * 100).toInt()
                          o.put("rateDay", if (todayAchieved) 100 else 0)
                          o.put("rateWeek", weekPct)
                      }
                  }
                  prefs.edit().putString(KEY_HABITS, arr.toString()).apply()
                  HabbitWidgetProvider.updateAllWidgets(context)
              }

              fun setWidgetHabitId(context: Context, appWidgetId: Int, habitId: String) {
                  context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                      .edit().putString("widget_$appWidgetId", habitId).apply()
              }

              fun getWidgetHabitId(context: Context, appWidgetId: Int): String {
                  return context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                      .getString("widget_$appWidgetId", "jung") ?: "jung"
              }

              fun rateForPeriod(item: HabitItem, period: String): Int {
                  return when (period) {
                      "day" -> if (isAchievedOnDay(item, 0)) 100 else 0
                      "week" -> item.rateWeek
                      "year" -> item.rateYear
                      else -> item.rateMonth
                  }
              }

              private fun defaultJson(): String {
                  return """
                  [
                    {"id":"jung","name":"중","color":"#00acc1","type":"bool","unit":"","target":1,"blockedPkg":"","blockedAppName":"","days":[1,0,1,1,1,0],"rateDay":100,"rateWeek":67,"rateMonth":62,"rateYear":58},
                    {"id":"man","name":"만","color":"#fb8c00","type":"bool","unit":"","target":1,"blockedPkg":"com.google.android.youtube","blockedAppName":"YouTube","days":[0,0,0,1,1,0],"rateDay":0,"rateWeek":33,"rateMonth":35,"rateYear":48},
                    {"id":"un","name":"운","color":"#7cb342","type":"bool","unit":"","target":1,"blockedPkg":"","blockedAppName":"","days":[1,0,0,1,0,0],"rateDay":100,"rateWeek":33,"rateMonth":45,"rateYear":41},
                    {"id":"gyung","name":"경","color":"#d81b60","type":"num","unit":"장","target":5,"blockedPkg":"","blockedAppName":"","days":[5,0,0,3,0,0],"rateDay":100,"rateWeek":33,"rateMonth":52,"rateYear":44},
                    {"id":"mul","name":"물","color":"#8e24aa","type":"bool","unit":"","target":1,"blockedPkg":"","blockedAppName":"","days":[0,0,0,0,0,0],"rateDay":0,"rateWeek":14,"rateMonth":20,"rateYear":25},
                    {"id":"jung2","name":"중2","color":"#1e88e5","type":"bool","unit":"","target":1,"blockedPkg":"","blockedAppName":"","days":[0,0,0,0,0,0],"rateDay":0,"rateWeek":29,"rateMonth":42,"rateYear":38}
                  ]
                  """.trimIndent()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/habbit/HabbitBlockerService.kt
          package com.example.habbit

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.view.accessibility.AccessibilityEvent

          class HabbitBlockerService : AccessibilityService() {

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null || event.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  val pkg = event.packageName?.toString() ?: return

                  // 본인 앱, 시스템 UI, 런처, 설정 화면은 차단 대상에서 제외
                  if (pkg == packageName ||
                      pkg.contains("systemui") ||
                      pkg.contains("launcher") ||
                      pkg.contains("settings") ||
                      pkg.contains("inputmethod") ||
                      pkg.contains("honeyboard")) {
                      return
                  }

                  val habits = HabbitStorage.getHabits(this)
                  val unachievedBlockingHabits = habits.filter { habit ->
                      habit.blockedPkg.isNotBlank() &&
                      habit.blockedPkg.split(",").map { it.trim() }.contains(pkg) &&
                      !HabbitStorage.isAchievedOnDay(habit, 0)
                  }

                  if (unachievedBlockingHabits.isNotEmpty()) {
                      val firstHabit = unachievedBlockingHabits.first()
                      val requirementDesc = if (firstHabit.type == "num") {
                          val cur = if (firstHabit.days.isNotEmpty()) firstHabit.days[0] else 0
                          "[${firstHabit.name}] 목표 기준 ${firstHabit.target}${firstHabit.unit} 이상 달성 필요 (현재: ${cur}${firstHabit.unit})"
                      } else {
                          "[${firstHabit.name}] 당일 목표 On(✓) 달성 필요"
                      }

                      val lockIntent = Intent(this, BlockedAppActivity::class.java).apply {
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                          putExtra("habit_name", firstHabit.name)
                          putExtra("habit_color", firstHabit.color)
                          putExtra("req_desc", requirementDesc)
                          putExtra("blocked_app_name", firstHabit.blockedAppName.ifBlank { pkg })
                      }
                      startActivity(lockIntent)
                  }
              }

              override fun onInterrupt() {}
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/habbit/BlockedAppActivity.kt
          package com.example.habbit

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class BlockedAppActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  renderLockView(intent)
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  if (intent != null) renderLockView(intent)
              }

              private fun renderLockView(intent: Intent) {
                  val habitName = intent.getStringExtra("habit_name") ?: "목표"
                  val habitColor = intent.getStringExtra("habit_color") ?: "#d81b60"
                  val reqDesc = intent.getStringExtra("req_desc") ?: "당일 목표를 먼저 달성해주세요."
                  val appName = intent.getStringExtra("blocked_app_name") ?: "선택된 앱"

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(64, 64, 64, 64)
                      setBackgroundColor(Color.parseColor("#1E1E1E"))
                  }

                  val iconView = TextView(this).apply {
                      text = "🔒"
                      textSize = 54f
                      gravity = Gravity.CENTER
                  }
                  root.addView(iconView)

                  val titleView = TextView(this).apply {
                      text = "${appName} 실행이 제한되었습니다"
                      textSize = 22f
                      setTextColor(Color.WHITE)
                      typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
                      gravity = Gravity.CENTER
                      setPadding(0, 32, 0, 16)
                  }
                  root.addView(titleView)

                  val descView = TextView(this).apply {
                      text = "당일 목표 미달성으로 인해 앱이 잠겨 있습니다.\n아래 조건을 달성하면 즉시 잠금이 해제됩니다."
                      textSize = 14f
                      setTextColor(Color.parseColor("#BBBBBB"))
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 40)
                  }
                  root.addView(descView)

                  val badgeView = TextView(this).apply {
                      text = reqDesc
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
                      gravity = Gravity.CENTER
                      setPadding(36, 36, 36, 36)
                      try {
                          setBackgroundColor(Color.parseColor(habitColor))
                      } catch (e: Exception) {
                          setBackgroundColor(Color.parseColor("#00ACC1"))
                      }
                  }
                  root.addView(badgeView)

                  val openHabbitBtn = Button(this).apply {
                      text = "habbit 열어서 [${habitName}] 기록하기"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#00ACC1"))
                      val lp = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                      lp.setMargins(0, 64, 0, 24)
                      layoutParams = lp
                      setOnClickListener {
                          startActivity(Intent(this@BlockedAppActivity, MainActivity::class.java).apply {
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                          })
                          finish()
                      }
                  }
                  root.addView(openHabbitBtn)

                  val homeBtn = Button(this).apply {
                      text = "홈 화면으로 돌아가기"
                      textSize = 15f
                      setTextColor(Color.parseColor("#CCCCCC"))
                      setBackgroundColor(Color.parseColor("#333333"))
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                      setOnClickListener {
                          val home = Intent(Intent.ACTION_MAIN).apply {
                              addCategory(Intent.CATEGORY_HOME)
                              flags = Intent.FLAG_ACTIVITY_NEW_TASK
                          }
                          startActivity(home)
                          finish()
                      }
                  }
                  root.addView(homeBtn)

                  setContentView(root)
              }

              override fun onBackPressed() {
                  val home = Intent(Intent.ACTION_MAIN).apply {
                      addCategory(Intent.CATEGORY_HOME)
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK
                  }
                  startActivity(home)
                  finish()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/habbit/HabbitWidgetProvider.kt
          package com.example.habbit

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.graphics.*
          import android.widget.RemoteViews

          class HabbitWidgetProvider : AppWidgetProvider() {

              override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
                  for (appWidgetId in appWidgetIds) {
                      updateSingleWidget(context, appWidgetManager, appWidgetId)
                  }
              }

              override fun onReceive(context: Context, intent: Intent) {
                  super.onReceive(context, intent)
                  if (intent.action == ACTION_TOGGLE) {
                      val widgetId = intent.getIntExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, -1)
                      if (widgetId != -1) {
                          val habitId = HabbitStorage.getWidgetHabitId(context, widgetId)
                          HabbitStorage.toggleTodayFromWidget(context, habitId)
                      }
                  }
              }

              companion object {
                  const val ACTION_TOGGLE = "com.example.habbit.ACTION_TOGGLE_HABIT"

                  fun updateAllWidgets(context: Context) {
                      val manager = AppWidgetManager.getInstance(context)
                      val ids = manager.getAppWidgetIds(ComponentName(context, HabbitWidgetProvider::class.java))
                      for (id in ids) {
                          updateSingleWidget(context, manager, id)
                      }
                  }

                  fun updateSingleWidget(context: Context, manager: AppWidgetManager, appWidgetId: Int) {
                      val habitId = HabbitStorage.getWidgetHabitId(context, appWidgetId)
                      val habits = HabbitStorage.getHabits(context)
                      if (habits.isEmpty()) return
                      val habit = habits.find { it.id == habitId } ?: habits.first()
                      val period = HabbitStorage.getPeriod(context)
                      val pct = HabbitStorage.rateForPeriod(habit, period)

                      val bmp = renderOneByOneWidget(habit, pct)
                      val views = RemoteViews(context.packageName, R.layout.widget_habbit_1x1)
                      views.setImageViewBitmap(R.id.widget_canvas, bmp)

                      val intent = Intent(context, HabbitWidgetProvider::class.java).apply {
                          action = ACTION_TOGGLE
                          putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, appWidgetId)
                      }
                      val pending = PendingIntent.getBroadcast(
                          context,
                          appWidgetId,
                          intent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                      views.setOnClickPendingIntent(R.id.widget_root, pending)
                      manager.updateAppWidget(appWidgetId, views)
                  }

                  private fun renderOneByOneWidget(habit: HabitItem, pct: Int): Bitmap {
                      val size = 256
                      val bmp = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888)
                      val canvas = Canvas(bmp)
                      val todayVal = if (habit.days.isNotEmpty()) habit.days[0] else 0
                      val isDone = HabbitStorage.isAchievedOnDay(habit, 0)

                      val bgPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          color = try {
                              if (isDone) Color.parseColor(habit.color) else Color.parseColor("#3F3F3F")
                          } catch (e: Exception) {
                              Color.parseColor("#3F3F3F")
                          }
                          style = Paint.Style.FILL
                      }
                      val cardRect = RectF(8f, 8f, size - 8f, size - 8f)
                      canvas.drawRoundRect(cardRect, 58f, 58f, bgPaint)

                      val cx = size / 2f
                      val cy = 108f
                      val radius = 58f

                      val trackPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          color = Color.argb(65, 255, 255, 255)
                          style = Paint.Style.STROKE
                          strokeWidth = 10f
                      }
                      canvas.drawCircle(cx, cy, radius, trackPaint)

                      val progPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          color = Color.WHITE
                          style = Paint.Style.STROKE
                          strokeWidth = 10f
                          strokeCap = Paint.Cap.ROUND
                      }
                      val arcRect = RectF(cx - radius, cy - radius, cx + radius, cy + radius)
                      val sweep = (pct.coerceIn(0, 100) / 100f) * 360f
                      canvas.drawArc(arcRect, -90f, sweep, false, progPaint)

                      val centerTextPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          color = Color.WHITE
                          textAlign = Paint.Align.CENTER
                          typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
                          textSize = if (habit.type == "num") 32f else 36f
                      }
                      val centerLabel = when {
                          habit.type == "num" -> "${todayVal}/${habit.target}"
                          isDone -> "✓"
                          else -> "✕"
                      }
                      val textOffset = (centerTextPaint.descent() + centerTextPaint.ascent()) / 2
                      canvas.drawText(centerLabel, cx, cy - textOffset, centerTextPaint)

                      val titlePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          color = Color.WHITE
                          textAlign = Paint.Align.CENTER
                          typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
                          textSize = 32f
                      }
                      canvas.drawText(habit.name, cx, 218f, titlePaint)

                      return bmp
                  }
              }
          }
