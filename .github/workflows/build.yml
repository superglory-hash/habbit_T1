              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="false"
              android:description="@string/accessibility_service_desc"
              android:notificationTimeout="100" />
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".BlockedAppActivity"
                      android:exported="true"
                      android:launchMode="singleInstance"
                      android:excludeFromRecents="true" />

                  <activity
                      android:name=".WidgetConfigActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_CONFIGURE" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".HabbitBlockerService"
                      android:exported="true"
                      android:label="habbit 미달성 앱 차단 서비스"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <receiver
                      android:name=".HabbitWidgetProvider"
                      android:exported="true"
                      android:label="habbit 1x1 목표 위젯">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="com.example.habbit.ACTION_TOGGLE_HABIT" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
